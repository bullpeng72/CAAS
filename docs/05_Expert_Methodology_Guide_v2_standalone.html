## 1.1 CAAS란 무엇인가?

### 1.1.1 탄생 배경: 멀티 에이전트 시스템 개발의 5가지 어려움

AI 멀티 에이전트 시스템을 프로덕션 환경에 배포하는 것은 극도로 어려운 작업입니다. 2025년 현재, 대부분의 조직이 다음과 같은 문제에 직면합니다:

#### 문제 #1: 복잡한 요구사항 → 구조화의 어려움

**현실**:
\`\`\`
비즈니스 요구사항 (자연어)
"고객 문의를 자동으로 처리하고, FAQ를 검색하며,
필요시 담당자에게 에스컬레이션하는 시스템이 필요합니다."

       ↓ (개발자가 수동으로 변환)

구조화된 명세 (???)
- Agent 개수는? 역할은?
- Task 흐름은?
- 도구(Tools)는 무엇이 필요한가?
- 의존성 관리는?
\`\`\`

**문제점**:
- 요구사항이 모호하고 불완전함
- 도메인 지식 부족 시 설계 오류 발생
- 명세 작성에 수일~수주 소요

#### 문제 #2: Agent 설계의 전문성 요구

**현실**:
\`\`\`python
# 개발자가 직접 설계해야 함
from crewai import Agent

agent = Agent(
    role="???",  # 어떤 역할이 적절한가?
    goal="???",  # 명확한 목표 설정이 어려움
    backstory="???",  # 효과적인 backstory는?
    tools=[???],  # 어떤 도구를 할당해야 하는가?
    allow_delegation=???  # 언제 True/False?
)
\`\`\`

**문제점**:
- CrewAI 전문 지식 필요
- Ontology (역할/도구 체계) 이해 필요
- 시행착오를 통한 최적화 필요 (수일 소요)

#### 문제 #3: Task 의존성 관리의 복잡도

**현실**:
\`\`\`python
# 수동으로 의존성 그래프 구성
task1 = Task(...)
task2 = Task(context=[task1])  # task1 결과 필요
task3 = Task(context=[task1, task2])  # 둘 다 필요
task4 = Task(context=[task3])  # 순환 참조 위험!

# 문제: 의존성이 복잡해지면 관리 불가능
\`\`\`

**문제점**:
- 순환 참조(circular dependency) 발생 위험
- 의존성 해결 순서 오류
- 병렬 실행 최적화 어려움

#### 문제 #4: 품질 보증의 어려움

**현실**:
\`\`\`
생성된 코드를 수동으로 검증:
- [ ] Python 문법 오류 없는가?
- [ ] CrewAI API 호환되는가?
- [ ] Tool이 정확히 할당되었는가?
- [ ] Task 의존성이 올바른가?
- [ ] 보안 위험은 없는가?
- [ ] 테스트 코드는 작동하는가?

→ 수동 검증 시간: 수시간~수일
\`\`\`

**문제점**:
- 자동화된 검증 도구 부재
- 수동 검증의 높은 오류율
- 반복적 수정 작업 (75-83% 시간 소비)

#### 문제 #5: 추적성(Traceability) 관리의 어려움

**현실**:
\`\`\`
요구사항 변경 시 영향 범위 파악 불가:

요구사항: "FAQ 검색 기능 제거"
       ↓
영향을 받는 Agent는? → 수동 확인 필요
영향을 받는 Task는? → 수동 확인 필요
영향을 받는 Tool은? → 수동 확인 필요

→ 추적 시간: 수시간
→ 누락 위험: 높음
\`\`\`

**문제점**:
- 요구사항 ↔ 코드 매핑 부재
- 변경 영향 분석 불가능
- 유지보수 비용 증가

### CAAS의 비전: "자연어로 프로덕션급 멀티 에이전트 시스템 생성"

**CAAS (CrewAI Agent Auto-generation System)**는 위 5가지 문제를 해결하기 위해 탄생했습니다.

**핵심 아이디어**:
\`\`\`
자연어 요구사항
      ↓
Golden Data (구조화된 명세)
      ↓
6-Phase Methodology
      ↓
프로덕션 코드 (main.py, agents.py, tasks.py, tools.py, tests)
\`\`\`

**CAAS의 약속**:
1. ✅ 요구사항 → 코드 **자동 변환** (5-10분 → 1-2분)
2. ✅ Agent 설계 **전문성 불필요** (Ontology 기반 자동 설계)
3. ✅ Task 의존성 **자동 관리** (순환 참조 자동 탐지)
4. ✅ **6개 Validator** 자동 검증 (품질 보증 100%)
5. ✅ **Traceability Matrix** 자동 생성 (변경 영향 즉시 파악)

**결과**:
- 98.7% 구현률 (AGENT_BASED 도메인)
- 개발 시간 83% 단축
- 버그 수정 시간 75-83% 단축

### 1.1.2 CAAS vs. 기존 솔루션

#### 비교 테이블: CAAS와 경쟁 솔루션

| 특징 | **CAAS** | LangChain | AutoGPT | GitHub Copilot | CrewAI (Manual) |
|------|----------|-----------|---------|----------------|-----------------|
| **입력** | 자연어 요구사항 | Python 코드 | 목표 설명 | 코드 컨텍스트 | Python 코드 |
| **출력** | **완전한 프로젝트** | 개발자가 조립 | 자율 실행 | 코드 스니펫 | 개발자가 작성 |
| **전문성 요구** | ⭐ 낮음 | ⭐⭐⭐ 높음 | ⭐⭐ 중간 | ⭐⭐⭐ 높음 | ⭐⭐⭐ 높음 |
| **품질 보증** | **6 Validators** | 수동 | 없음 | 없음 | 수동 |
| **프로덕션 레디** | **✅ Yes** | 개발자 의존 | ❌ No | 개발자 의존 | 개발자 의존 |
| **멀티 에이전트** | **✅ 98.7% 구현률** | 수동 구현 | 단일 에이전트 | 지원 안 함 | 수동 구현 |
| **추적성** | **✅ 자동** | 수동 | 없음 | 없음 | 수동 |
| **자동 수정** | **✅ 3-Level** | 없음 | 없음 | 없음 | 없음 |
| **도메인 특화** | **✅ 17개 도메인** | 없음 | 없음 | 없음 | 없음 |
| **생성 시간** | **1-2분** | 수시간~수일 | N/A | 수시간~수일 | 수시간~수일 |

#### 상세 비교

**1. LangChain / LlamaIndex**
- **강점**: 유연한 LLM 체인 구성, 풍부한 통합
- **약점**: 개발자가 직접 Agent와 Task를 코딩해야 함
- **CAAS 차별점**: CAAS는 코드를 **생성**하고, LangChain은 개발자가 **작성**

**2. AutoGPT / BabyAGI**
- **강점**: 자율적 목표 달성, 동적 Task 생성
- **약점**: 코드 생성이 아닌 자율 실행, 프로덕션 배포 어려움
- **CAAS 차별점**: CAAS는 **프로덕션 코드**를 생성, AutoGPT는 **실행**

**3. GitHub Copilot**
- **강점**: 코드 자동완성, 빠른 프로토타이핑
- **약점**: 시스템 설계 불가, Agent 설계 지원 없음
- **CAAS 차별점**: CAAS는 **시스템 전체**를 설계, Copilot은 **코드 조각** 생성

**4. CrewAI (Manual)**
- **강점**: 강력한 멀티 에이전트 프레임워크
- **약점**: 개발자가 수동으로 모든 것을 설계 및 구현
- **CAAS 차별점**: CAAS는 CrewAI 코드를 **자동 생성** (98.7% 구현률)

#### CAAS의 고유한 가치

**CAAS만의 3가지 차별점**:

1. **Specification-First**: Golden Data라는 Formal Specification 기반
   - 모든 생성 결과가 명세에서 유래
   - 추적성 100% 보장
   - 변경 영향 분석 자동

2. **Domain-Driven**: 17개 도메인별 최적화 코드 생성
   - CONVERSATIONAL_AI: 98.7% 구현률
   - DATA_ANALYSIS: 98.3% 구현률
   - 도메인 패턴 자동 적용

3. **Quality-First**: 자동 검증 + 자동 수정
   - 6 Validators: Ontology, Golden Data, Dependency, Python311, CrewAI, Task
   - 3-Level Auto-Fixing: Template → Rule → LLM
   - Quality Gate: strict_quality_gates=True (v0.4.1)

### 1.2.8 설계 원칙 5가지

CAAS 아키텍처는 다음 5가지 설계 원칙을 따릅니다:

**1. Framework-First**
- UI-독립적 코어 (\`caas_framework/\`)
- 다중 인터페이스 지원 (CLI, SDK, Web UI)
- 라이브러리로 사용 가능

**2. Plugin-based**
- 확장 가능한 플러그인 아키텍처
- Abstract Base Class 패턴
- LLM/Graph DB Provider 교체 가능

**3. Type-safe**
- Pydantic 기반 타입 안전성
- JSON Schema 자동 생성
- 런타임 검증

**4. Async-first**
- 모든 I/O 작업 비동기 처리
- 병렬 실행 최적화
- 높은 처리량

**5. Testable**
- 각 Layer 독립적 테스트
- Mock 지원
- 160+ 테스트 (v0.4.1)

### 1.2.9 요약: 6-Layer 아키텍처의 강점

**명확한 책임 분리**:
- 각 Layer는 단일 책임 원칙 준수
- 상위 Layer는 하위 Layer에만 의존
- 역방향 의존성 없음

**확장 가능성**:
- Plugin System으로 새로운 Provider 추가 쉬움
- Domain Patterns로 새로운 도메인 지원 쉬움
- Template System으로 코드 생성 커스터마이즈 쉬움

**유지보수성**:
- Layer별 독립적 업데이트 가능
- 타입 안전성으로 버그 조기 발견
- 160+ 테스트로 회귀 방지

**다음 섹션 미리보기**: 1.3에서는 CAAS의 데이터 흐름을 End-to-End로 추적하여 자연어 요구사항이 어떻게 프로덕션 코드로 변환되는지 이해합니다.

## 2.1 6-Phase Methodology 개요

### 2.1.1 Phase 0-6 전체 개요

CAAS의 6-Phase Methodology는 **체계적인 데이터 변환 파이프라인**입니다. 각 Phase는 명확한 입력과 출력을 가지며, 순차적으로 실행됩니다.

**Phase 전체 개요**:

| Phase | 이름 | 목적 | 입력 | 출력 | 소요 시간 |
|-------|------|------|------|------|----------|
| **Phase 0** | Concretization | 요구사항 구체화 | 자연어 요구사항 | Golden Data | 1-2분 |
| **Phase 1** | Discovery | 요구사항 분석 | Golden Data | Requirements Spec | 1-2분 |
| **Phase 2** | Architecture | 시스템 설계 | Golden Data + Spec | Architecture Design | 2-3분 |
| **Phase 3** | Design | Agent/Task 설계 | Architecture | Agent/Task Specs | 2-3분 |
| **Phase 4** | Development | 코드 명세 생성 | Agent/Task Specs | Code Specification | 1분 |
| **Phase 5** | Delivery | 프로덕션 코드 생성 | Code Spec | Production Code | 2-3분 |
| **Phase 6** | Code Analysis | 코드 분석 및 수정 | Code + Golden Data | Analysis Report | 1-2분 |

**총 소요 시간**: 10-16분 (병렬 실행 시 7-11분)

### 2.1.2 병렬화 전략

#### 전략 1: Phase 1-2 병렬화 (Discovery + Architecture)

**원리**:
- Discovery는 Golden Data만 필요 → 즉시 시작 가능
- Architecture는 Golden Data로 시작, Discovery 완료 시 개선
- Discovery 결과가 Architecture 품질 향상

**구현**:
\`\`\`python
# DistributedPhaseExecutor 사용
dependency_graph = DependencyGraph(
    phases=["discovery", "architecture"],
    dependencies={
        "architecture": ["discovery"]  # Soft dependency
    }
)

# 병렬 실행
results = await executor.execute_phases(
    dependency_graph=dependency_graph,
    phase_functions={
        "discovery": execute_discovery,
        "architecture": execute_architecture
    }
)

# Discovery 완료 시 Architecture가 결과 활용하여 개선
\`\`\`

**성능 개선**:
- 순차 실행: 3-4분 (Discovery 1분 + Architecture 2-3분)
- 병렬 실행: 2.5-3.5분 (Discovery 1분 ∥ Architecture 2-3분, 개선)
- **Speedup: ~1.3x**

#### 전략 2: Phase 5-6 병렬화 (QA + Code Analysis) (v0.4.0+)

**원리**:
- QA와 Code Analysis 모두 code_artifacts만 필요
- 둘 사이 의존성 없음 → 완전 병렬 가능
- 최대 성능 향상

**구현**:
\`\`\`python
# 완전 독립 병렬 실행
dependency_graph = DependencyGraph(
    phases=["qa", "code_analysis"],
    dependencies={}  # No dependencies
)

# 병렬 실행
results = await executor.execute_phases(
    dependency_graph=dependency_graph,
    phase_functions={
        "qa": execute_qa,
        "code_analysis": execute_code_analysis
    }
)
\`\`\`

**성능 개선**:
- 순차 실행: 3-4분 (QA 2분 + Code Analysis 1-2분)
- 병렬 실행: 2분 (QA 2분 ∥ Code Analysis 1-2분)
- **Speedup: ~1.75x**

**전체 워크플로우 성능**:

**1. Phase별 독립 재실행**

**2. 자동 Retry with Fallback**
\`\`\`python
async def execute_phase_with_retry(
    phase: int,
    max_retries: int = 3
) -> PhaseResult:
    """
    Phase 실행 with automatic retry

    Retry 전략:
    1. 동일 입력으로 재시도 (transient error)
    2. 입력 수정 후 재시도 (LLM Judge 피드백)
    3. Fallback to simpler approach
    """

    for attempt in range(max_retries):
        try:
            result = await execute_phase(phase)

            # Quality Gate 검증
            if quality_gate.passed(result):
                return result
            else:
                # LLM Judge 피드백으로 입력 개선
                improved_input = improve_input(
                    feedback=quality_gate.feedback
                )
                continue

        except Exception as e:
            logger.warning(f"Phase {phase} failed (attempt {attempt+1}): {e}")

            if attempt == max_retries - 1:
                raise PhaseExecutionError(f"Phase {phase} failed after {max_retries} attempts") from e

            # Exponential backoff
            await asyncio.sleep(2 ** attempt)
\`\`\`

**3. Manual Recovery**
\`\`\`bash
# 수동으로 Golden Data 수정 후 재실행
vim artifacts/phase_0/golden_data.json  # 수정
caas generate-phase --phase 1 \\
  --golden-data artifacts/phase_0/golden_data.json
\`\`\`

### Phase 0: Concretization (요구사항 구체화)

**목적**: 자연어 요구사항 → Golden Data (Formal Specification)

**왜 Golden Data가 필요한가? (SDD 이론)**

**Specification-Driven Development (SDD)**의 핵심 원칙:
> "명세가 명확하면 코드는 자동화 가능하다."

**문제**:
\`\`\`
자연어 요구사항의 모호성:
"고객 문의를 자동으로 처리하는 챗봇"

→ 어떤 문의를? (FAQ? 주문? 환불?)
→ 어떻게 처리하는가? (즉시 답변? 티켓 생성?)
→ 자동의 범위는? (100% 자동? 담당자 확인?)
\`\`\`

**해결책: Golden Data**
\`\`\`json
{
  "domain": "CONVERSATIONAL_AI",
  "features": [
    {

      "name": "FAQ 자동 응답",

      "priority": "high"
    },

**Golden Data의 3가지 장점**:
1. **명확성**: 모호성 제거, 구조화된 명세
2. **추적성**: 요구사항 ↔ 코드 매핑 자동
3. **검증 가능성**: 구현 완전성 자동 측정

**어떻게 작성하는가? (실전 예시)**

**핵심 컴포넌트**:
\`\`\`python
class RequirementConcretizer:
    """
    자연어 → Golden Data 변환기

    Features:
    - HierarchicalFeatureExtractor (v0.3.0+)
    - 3-Strategy JSON Parsing
    - Domain-specific 최적화
    """

    async def concretize(
        self,
        requirement: str,
        domain: Optional[str] = None
    ) -> ConcretizedRequirement:
        # 1. LLM으로 초안 생성
        draft = await self._generate_draft(requirement)

        # 2. Feature 계층 구조 추출
        features = self._extract_hierarchical_features(draft)

        # 3. Boundaries/Commands 자동 설정
        boundaries = self._infer_boundaries(features)
        commands = self._infer_commands(domain)

        # 4. Golden Data 생성
        golden_data = ConcretizedRequirement(
            domain=domain or self._classify_domain(requirement),
            project_name=self._generate_project_name(requirement),
            features=features,
            boundaries=boundaries,
            commands=commands
        )

        return golden_data
\`\`\`

class RequirementAnalystAgent(BaseExpertAgent):
    """Phase 1: 요구사항 분석"""

    async def execute(self, input_data: Dict) -> RequirementAnalysisResult:
        golden_data = input_data["golden_data"]

        # 1. 도메인 분류
        domain = await self._classify_domain(golden_data)

        # 2. Feature 분석
        feature_analysis = await self._analyze_features(golden_data)

        # 3. 복잡도 평가
        complexity = self._assess_complexity(feature_analysis)

        # 4. 기술 스택 추천
        tech_stack = self._recommend_tech_stack(domain, complexity)

        # 5. Agent/Task 개수 추정
        estimated_agents = self._estimate_agent_count(feature_analysis)
        estimated_tasks = self._estimate_task_count(feature_analysis)

        return RequirementAnalysisResult(
            domain=domain,
            execution_pattern=self._get_execution_pattern(domain),
            feature_analysis=feature_analysis,
            complexity_assessment=complexity,
            recommended_tech_stack=tech_stack,
            estimated_agent_count=estimated_agents,
            estimated_task_count=estimated_tasks
        )

**목적**: 시스템 컴포넌트 분해 및 Traceability Matrix 생성

**이론: Traceability Matrix 개념**

**Traceability Matrix**는 요구사항(Feature) → Agent → Task → 코드의 매핑을 관리합니다.

**구조**:

    "mapped_code_files": ["agents.py:10-25", "tasks.py:5-15"],
    "implementation_status": "completed",
    "coverage": 100
  },
  "F2": {
    "feature_name": "티켓 생성",
    "mapped_agents": ["ticket_agent"],

**이점**:
1. **변경 영향 분석**: Feature 수정 시 영향받는 Agent/Task 즉시 파악
2. **구현 완전성 검증**: 모든 Feature가 Agent/Task로 매핑되었는지 확인
3. **추적성 100%**: 요구사항 → 코드 완전 추적

**실전: 컴포넌트 분해 패턴**

class SystemArchitectAgent(BaseExpertAgent):
    """Phase 2: 시스템 아키텍처 설계"""

    async def execute(self, input_data: Dict) -> SystemArchitectureResult:
        golden_data = input_data["golden_data"]
        requirement_analysis = input_data.get("requirement_analysis")

        # 1. 컴포넌트 분해
        components = await self._decompose_components(
            golden_data, requirement_analysis
        )

        # 2. Agent 후보 식별
        agent_candidates = self._identify_agent_candidates(components)

        # 3. 데이터 흐름 설계
        data_flows = self._design_data_flows(agent_candidates)

        # 4. Traceability Matrix 생성
        traceability_matrix = self._build_traceability_matrix(
            golden_data.features, agent_candidates
        )

        # 5. 아키텍처 검증
        validation_result = self._validate_architecture(
            agent_candidates, data_flows, traceability_matrix
        )

        return SystemArchitectureResult(
            components=components,
            agent_candidates=agent_candidates,
            data_flows=data_flows,
            traceability_matrix=traceability_matrix,
            validation_result=validation_result
        )

### Phase 3: Design (Agent/Task 설계 최적화)

**목적**: Agent/Task 명세 생성 및 Ontology 기반 Tool 할당

**이론: Ontology 기반 Tool 할당**

**Ontology System**은 Agent Role → 추천 Tools 매핑을 정의합니다.

**예시**:
\`\`\`python
ONTOLOGY_RULES = {
    "RESEARCHER": {
        "recommended_tools": ["search", "web_scraping", "document_reader"],
        "compatible_task_types": ["RESEARCH", "ANALYSIS"]
    },
    "WRITER": {
        "recommended_tools": ["text_generation", "grammar_check"],
        "compatible_task_types": ["WRITING", "CONTENT_CREATION"]
    },
    "CODER": {
        "recommended_tools": ["code_execution", "file_operations"],
        "compatible_task_types": ["CODING", "DEBUGGING"]
    },
    "CONVERSATION_MANAGER": {
        "recommended_tools": ["search_faq", "chat_memory", "sentiment_analysis"],
        "compatible_task_types": ["CUSTOMER_SERVICE", "CHAT"]
    }
}
\`\`\`

**Tool 할당 알고리즘**:
\`\`\`python
def assign_tools(agent_role: str, task_types: List[str]) -> List[str]:
    """
    Agent Role 및 Task Type 기반 Tool 자동 할당

    1. Ontology에서 추천 Tools 가져오기
    2. Task Type과 Tool 호환성 검증
    3. 중복 제거 및 우선순위 정렬
    """

    # Ontology 조회
    recommended_tools = ONTOLOGY_RULES[agent_role]["recommended_tools"]

    # Task Type 호환 Tools 필터링
    compatible_tools = [
        tool for tool in recommended_tools
        if is_compatible(tool, task_types)
    ]

    return compatible_tools
\`\`\`

**실전: Agent 설계 Best Practices**

**Agent Designer Agent 실행**:
\`\`\`python
class AgentDesignerAgent(BaseExpertAgent):
    """Phase 3: Agent/Task 설계"""

    async def execute(self, input_data: Dict) -> AgentTaskDesignResult:
        golden_data = input_data["golden_data"]
        architecture_design = input_data["architecture_design"]

        # 1. Agent 명세 생성
        agents = await self._generate_agent_specs(
            golden_data, architecture_design
        )

        # 2. Task 명세 생성
        tasks = await self._generate_task_specs(
            golden_data, agents, architecture_design
        )

        # 3. Ontology 기반 Tool 할당
        agents_with_tools = self._assign_tools_to_agents(
            agents, tasks, golden_data
        )

        # 4. Task 의존성 그래프 구성
        task_dependency_graph = self._build_task_dependency_graph(tasks)

        # 5. 검증
        validation_result = self._validate_design(
            agents_with_tools, tasks, task_dependency_graph
        )

        return AgentTaskDesignResult(
            agents=agents_with_tools,
            tasks=tasks,
            task_dependency_graph=task_dependency_graph,
            validation_result=validation_result
        )
\`\`\`

**Code Spec Generator 실행**:

class CodeSpecGenerator:
    """Phase 4: 코드 명세 생성"""

    async def generate_code_spec(
        self,
        agents: List[AgentSpecModel],
        tasks: List[TaskSpecModel],
        golden_data: ConcretizedRequirement
    ) -> CodeSpecification:
        """
        Agent/Task 명세 → 코드 명세 변환

        생성 항목:
        - main.py spec
        - agents.py spec
        - tasks.py spec
        - tools.py spec
        """

        # 도메인별 템플릿 선택
        domain_strategy = self._get_domain_strategy(golden_data.domain)

        # 코드 명세 생성
        specs = {
            "main.py": self._generate_main_spec(
                agents, tasks, domain_strategy
            ),
            "agents.py": self._generate_agents_spec(
                agents, domain_strategy
            ),
            "tasks.py": self._generate_tasks_spec(
                tasks, domain_strategy
            ),
            "tools.py": self._generate_tools_spec(
                agents, tasks, domain_strategy
            )
        }

        return CodeSpecification(specs=specs)

**이론: 3-Level Auto-Fixing 전략**

**3-Level Hierarchy**:
\`\`\`
Level 1: Template-based Fix

Level 2: Rule-based Fix

Level 3: LLM-based Fix

  ├─ 방법: LLM 지능적 수정
  └─ 적용: 복잡한 로직 오류

**Code Generator Agent 실행**:
\`\`\`python
class CodeGeneratorAgent(BaseExpertAgent):
    """Phase 5: 프로덕션 코드 생성"""

    async def execute(self, input_data: Dict) -> CodeGenerationResult:
        agents = input_data["agents"]
        tasks = input_data["tasks"]
        golden_data = input_data["golden_data"]

        # 1. 도메인 전략 선택
        domain = golden_data.domain
        strategy = self.code_engine.get_domain_strategy(domain)

        # 2. 코드 생성 (Jinja2 템플릿)
        code_files = await self.code_engine.generate_all_files(
            golden_data=golden_data,
            agents=agents,
            tasks=tasks,
            strategy=strategy
        )

        # 3. 3-Level Auto-Fixing 적용
        fixed_code_files = {}
        for filename, content in code_files.items():
            # Level 1: Template-based
            fixed = self.auto_fixer.fix_level_1(content)

            # Level 2: Rule-based
            if not self.validator.validate(fixed):
                fixed = self.auto_fixer.fix_level_2(fixed)

            # Level 3: LLM-based (필요 시)
            if not self.validator.validate(fixed):
                fixed = await self.auto_fixer.fix_level_3(fixed)

            fixed_code_files[filename] = fixed

        # 4. 정적 파일 생성
        static_files = StaticFileGenerators.generate_all(
            golden_data, agents, tasks
        )
        fixed_code_files.update(static_files)

        return CodeGenerationResult(
            code_files=fixed_code_files,
            output_dir=self.output_dir
        )

### Phase 6: Code Analysis (코드 분석 및 수정) (v0.4.0)

**목적**: 런타임 오류 자동 수정 및 추적성 검증

**이론: 8+ 런타임 오류 타입**

**지원 오류 타입**:
1. **ImportError**: 모듈 import 실패
2. **AttributeError**: 속성 접근 오류
3. **TypeError**: 타입 오류
4. **NameError**: 변수명 오류
5. **ValueError**: 값 오류
6. **KeyError**: Dict 키 오류
7. **IndentationError**: 들여쓰기 오류
8. **SyntaxError**: 문법 오류

**실전: 자동 수정 패턴**

**Code Analysis Agent 실행**:
\`\`\`python
class CodeAnalysisAgent(BaseExpertAgent):
    """Phase 6: 코드 분석 및 수정"""

    async def execute(self, input_data: Dict) -> CodeAnalysisReport:
        code_artifacts = input_data["code_artifacts"]
        golden_data = input_data["golden_data"]

        # 1. 런타임 오류 분석
        runtime_errors = await self._analyze_runtime_errors(code_artifacts)

        # 2. 자동 수정
        fixed_errors = []
        for error in runtime_errors:
            fix = await self._fix_runtime_error(error, code_artifacts)
            if fix.success:
                fixed_errors.append(fix)

        # 3. 추적성 검증
        traceability_result = self._verify_traceability(
            code_artifacts, golden_data
        )

        # 4. 구현 완전성 분석
        completeness = self._analyze_completeness(
            code_artifacts, golden_data
        )

        return CodeAnalysisReport(
            runtime_errors=runtime_errors,
            fixed_errors=fixed_errors,
            traceability_result=traceability_result,
            completeness_analysis=completeness,
            overall_health_score=self._calculate_health_score(...)
        )

### 2.3.2 Feature 명세 기법

**Hierarchical Feature Extraction (v0.3.0+)**

**원칙**: Feature는 계층 구조로 작성
- **Parent Feature**: 상위 기능 (예: "제품 추천")
- **Sub-Features**: 하위 세부 기능 (예: "선호도 분석", "추천 알고리즘")

**예시**:

  "priority": "high",
  "sub_features": [
    {
      "id": "F1.1",
      "name": "선호도 분석",
      "description": "고객 구매 이력 및 검색 이력 분석",
      "priority": "high"

### 3.1.2 복잡도 측정 지표

**복잡도 측정 5가지 지표**:

| 지표 | 설명 | 측정 방법 | 임계값 |
|------|------|----------|--------|
| **Feature 개수** | 총 기능 개수 | len(features) | 15개 이하 권장 |
| **Agent 개수** | 필요한 Agent 수 | estimated_agents | 7개 이하 권장 |
| **Task 개수** | Task 총 개수 | estimated_tasks | 15개 이하 권장 |
| **의존성 깊이** | Task 의존성 최대 깊이 | max(dependency_depth) | 4 이하 권장 |
| **도메인 다양성** | 관련 도메인 수 | len(unique_domains) | 2개 이하 권장 |

**복잡도 점수 계산**:
\`\`\`python
def calculate_complexity_score(
    feature_count: int,
    agent_count: int,
    task_count: int,
    dependency_depth: int,
    domain_count: int
) -> float:
    """
    복잡도 점수 계산 (0-100)

    - 0-30: 낮음 (단일 프로젝트)
    - 31-60: 중간 (모듈화)
    - 61-80: 높음 (다단계)
    - 81-100: 매우 높음 (분할 필요)
    """

    score = 0

    # Feature 개수 (0-25점)
    score += min(feature_count / 15 * 25, 25)

    # Agent 개수 (0-25점)
    score += min(agent_count / 7 * 25, 25)

    # Task 개수 (0-20점)
    score += min(task_count / 15 * 20, 20)

    # 의존성 깊이 (0-15점)
    score += min(dependency_depth / 4 * 15, 15)

    # 도메인 다양성 (0-15점)
    score += min(domain_count / 2 * 15, 15)

    return min(score, 100)

# 예시
score = calculate_complexity_score(
    feature_count=12,
    agent_count=5,
    task_count=10,
    dependency_depth=3,
    domain_count=1
)
# score ≈ 50 (중간 복잡도, 모듈화 전략 추천)
\`\`\`

## 3.2 시스템 분할 및 Domain 선택

### 3.2.1 시스템 분할 전략

#### Bounded Context 기반 분할

**원칙**: Domain-Driven Design의 Bounded Context를 활용하여 시스템을 논리적으로 분할합니다.

**Bounded Context란?**
- 특정 도메인 모델이 유효한 경계
- 동일한 용어가 다른 의미를 가질 수 있는 경계
- 독립적인 데이터베이스 및 비즈니스 로직

#### Microservices vs. Monolith 판단 기준

**언제 Microservices를 선택하는가?**

| 기준 | Microservices 선택 | Monolith 선택 |
|------|-------------------|---------------|
| **팀 크기** | 10명 이상, 다중 팀 | 5명 이하, 단일 팀 |
| **Feature 개수** | 31개 이상 | 30개 이하 |
| **배포 빈도** | 주 1회 이상 | 월 1회 이하 |
| **확장 요구** | 부분 확장 필요 | 전체 확장 가능 |
| **도메인 복잡도** | 높음 (다중 Bounded Context) | 낮음-중간 |
| **독립 배포** | 필수 | 불필요 |

**Microservices 선택 예시**:
\`\`\`
프로젝트: 대형 E-Commerce 플랫폼
- 팀: 3개 팀 (15명)
- Feature: 50개
- 배포: 주 2-3회
- 확장: 제품 검색만 5배 확장 필요
→ Microservices 아키텍처 선택 ✅
\`\`\`

**Monolith 선택 예시**:
\`\`\`
프로젝트: 스타트업 MVP
- 팀: 1개 팀 (3명)
- Feature: 10개
- 배포: 월 1-2회
- 확장: 전체 2배 확장 가능
→ Monolith 아키텍처 선택 ✅
\`\`\`

### 3.2.2 17개 도메인 결정 가이드

#### Execution Pattern 선택 (AGENT_BASED, HYBRID, CRUD_BASED)

**3가지 Execution Pattern 비교**:

| Pattern | 주요 특징 | Agent 구성 | 데이터 처리 | 적합한 도메인 | 구현률 |
|---------|----------|-----------|-----------|-------------|--------|
| **AGENT_BASED** | AI 협업 중심 | 3-7개 AI Agents | 최소 | CONVERSATIONAL_AI, CONTENT_CREATION | **98.7%** ⭐ |
| **HYBRID** | AI + CRUD 혼합 | 2-5개 Agents + CRUD | 중간 | DATA_ANALYSIS, E_COMMERCE | **98.3%** ⭐ |
| **CRUD_BASED** | 데이터 관리 중심 | 1-3개 Agents + DB | 주요 | DASHBOARD, API_INTEGRATION | 중간 |

**언제 AGENT_BASED를 선택하는가?**

**선택 기준**:
- AI 협업이 핵심 가치
- 데이터 처리 최소 (CRUD 작업 < 30%)
- 창의적 작업 (대화, 콘텐츠 생성, 분석)

**예시 도메인**:
1. **CONVERSATIONAL_AI** (98.7% 구현률)
   - 챗봇, 대화형 AI
   - Agent 예시: ConversationAgent, ContextAgent, ResponseAgent

2. **CONTENT_CREATION** (98.7% 구현률)
   - 블로그 글, 마케팅 카피, 소셜 미디어 콘텐츠
   - Agent 예시: ResearchAgent, WriterAgent, EditorAgent

3. **CUSTOMER_SUPPORT**
   - 고객 문의 처리, FAQ, 티켓 관리
   - Agent 예시: SupportAgent, TicketAgent, EscalationAgent

**언제 HYBRID를 선택하는가?**

**선택 기준**:
- AI + 데이터 처리 모두 중요
- CRUD 작업 30-60%
- 분석 + 추천 + 데이터 관리

**예시 도메인**:
1. **DATA_ANALYSIS** (98.3% 구현률)
   - 데이터 분석, 시각화, 인사이트 생성
   - Agent 예시: DataAnalystAgent, VisualizerAgent
   - CRUD: 데이터 조회, 저장

2. **E_COMMERCE**
   - 제품 추천, 주문 처리, 재고 관리
   - Agent 예시: RecommenderAgent, OrderProcessorAgent
   - CRUD: 제품/주문 데이터 관리

3. **REPORT_GENERATION**
   - 리포트 자동 생성, 인사이트 추출
   - Agent 예시: ReportGeneratorAgent, InsightAgent
   - CRUD: 데이터 집계, 리포트 저장

**언제 CRUD_BASED를 선택하는가?**

**선택 기준**:
- 데이터 관리가 핵심
- AI 작업 최소 (< 30%)
- CRUD 작업 > 60%

**예시 도메인**:
1. **DASHBOARD**
   - 대시보드 데이터 표시, 필터링
   - Agent 예시: DataAggregatorAgent (최소)
   - CRUD: 데이터 조회, 집계

2. **API_INTEGRATION**
   - API 연동, 데이터 동기화
   - Agent 예시: SyncAgent (최소)
   - CRUD: 데이터 변환, 저장

## 3.3 Agent/Task 설계 패턴

### 3.3.1 Agent 설계 Best Practices

#### Practice #1: Role/Goal/Backstory 작성 기법

**Role (역할)**:
- **원칙**: 명확하고 구체적인 직무명
- **길이**: 2-5 단어
- **형식**: "~Specialist", "~Manager", "~Expert"

**✅ Good Role Examples**:
\`\`\`
"Customer Service Representative"
"Data Analysis Specialist"
"Content Writing Expert"
"Research and Information Specialist"
\`\`\`

**❌ Bad Role Examples**:
\`\`\`
"AI"  // ❌ 너무 추상적
"Helper"  // ❌ 역할 불명확
"Chatbot Agent"  // ❌ 구체적이지 않음
\`\`\`

---

**Goal (목표)**:
- **원칙**: 측정 가능한 구체적 목표
- **길이**: 10-20 단어
- **형식**: 동사 시작, 결과 중심

**✅ Good Goal Examples**:
\`\`\`
"Handle customer inquiries and provide accurate, helpful responses within 2 minutes"

"Analyze sales data and generate actionable insights to improve revenue by 10%"

"Research comprehensive information on given topics and summarize key findings in 500 words"
\`\`\`

**❌ Bad Goal Examples**:
\`\`\`
"Help customers"  // ❌ 측정 불가능
"Do data analysis"  // ❌ 결과 불명확
"Be a good agent"  // ❌ 추상적
\`\`\`

---

**Backstory (배경 스토리)**:
- **원칙**: Agent의 경험, 전문성, 성격 정의
- **길이**: 50-150 단어
- **형식**: 3인칭 과거형

**✅ Good Backstory Example**:
\`\`\`
"You are an experienced customer service representative with 5 years of experience
in the e-commerce industry. You have handled over 10,000 customer inquiries and
maintain a 95% satisfaction rating. You are known for your patience, empathy, and
ability to quickly find solutions to complex problems. You are skilled at de-escalating
tense situations and turning frustrated customers into satisfied ones."
\`\`\`

**❌ Bad Backstory Example**:
\`\`\`
"You are an agent."  // ❌ 정보 없음
"You are good at your job."  // ❌ 구체적이지 않음
\`\`\`

#### Practice #2: Tool 할당 원칙 (Ontology 기반)

**원칙 1: Ontology 기반 자동 할당**

**Ontology Mapping**:

ROLE_TO_TOOLS = {

    ],

    ],

**원칙 2: 최소 필요 도구만 할당**
\`\`\`
✅ Good: tools=["search_faq", "chat_memory"]  # 필요한 2개만
❌ Bad: tools=[모든 도구 20개]  # 과도함
\`\`\`

**원칙 3: Task 요구사항 기반 검증**
\`\`\`python
def validate_tool_assignment(agent: AgentSpecModel, tasks: List[TaskSpecModel]):
    """
    Agent의 Tools가 할당된 Task 수행에 충분한지 검증

    예시:
    - Task: "Search FAQ database"
    - Required Tool: "search_faq"
    - Agent Tools: ["search_faq", "chat_memory"] ✅
    """
    agent_tasks = [t for t in tasks if t.agent_id == agent.id]

    for task in agent_tasks:
        required_tools = infer_required_tools(task.description)
        if not all(tool in agent.tools for tool in required_tools):
            raise ToolMissingError(f"Agent {agent.id} missing tools for Task {task.id}")
\`\`\`

#### Practice #3: Agent 개수 최적화 (3-7개 추천)

**원칙**: **적을수록 좋음**, 단 책임 분리는 유지

**Agent 개수 가이드**:
| Feature 개수 | 추천 Agent 개수 | 이유 |
|-------------|----------------|------|
| 1-3개 | 2-3개 | 최소 구성 |
| 4-8개 | 3-5개 | 권장 범위 ⭐ |
| 9-15개 | 5-7개 | 최대 권장 |
| 16+개 | 시스템 분할 고려 | 복잡도 증가 |

**Agent 통합 전략**:
\`\`\`
Before (너무 많은 Agent):
├─ FAQSearchAgent
├─ FAQResponderAgent
├─ ChatMemoryAgent
├─ SentimentAgent
└─ EscalationAgent
(5개 Agent)

After (통합):
├─ ConversationAgent
│  └─ 책임: FAQ 검색, 응답 생성, 메모리 관리, 감정 분석
└─ EscalationAgent
   └─ 책임: 티켓 생성, 담당자 할당
(2개 Agent) ✅
\`\`\`

**통합 기준**:
1. **동일 모듈**: 같은 기능 모듈 → 하나의 Agent
2. **강한 의존성**: Agent 간 의존성 높음 → 통합
3. **순차 실행**: Task가 항상 순차 실행 → 통합 가능

#### Practice #4: Delegation 패턴

**allow_delegation 설정**:
\`\`\`python
# Manager Agent (hierarchical process)
manager = AgentSpecModel(
    role="Project Manager",
    allow_delegation=True  # ✅ Manager는 True
)

# Worker Agent
worker = AgentSpecModel(
    role="Research Specialist",
    allow_delegation=False  # ✅ Worker는 False
)
\`\`\`

**언제 Delegation을 사용하는가?**

| 상황 | allow_delegation | 이유 |
|------|-----------------|------|
| **Hierarchical Process** | True (Manager만) | Manager가 Worker에게 위임 |
| **Sequential Process** | False (모두) | 순차 실행, 위임 불필요 |
| **Complex Decision** | True (Manager) | Manager가 동적 결정 |

**Delegation 패턴 예시**:
\`\`\`python
# Hierarchical Process
crew = Crew(
    agents=[manager, worker1, worker2],
    tasks=[task1, task2, task3],
    process=Process.hierarchical,  # Manager가 Task 할당
    manager_llm=ChatOpenAI(model="gpt-4o")
)

# Manager Agent
manager = Agent(
    role="Project Manager",
    goal="Coordinate team and delegate tasks effectively",
    allow_delegation=True  # Manager만 True
)

# Worker Agents
worker1 = Agent(
    role="Researcher",
    allow_delegation=False  # Worker는 False
)
worker2 = Agent(
    role="Writer",
    allow_delegation=False
)
\`\`\`

### 3.3.2 Task 설계 Best Practices

#### Practice #1: Task 명세 작성 (Description, Expected Output)

**Description (작업 설명)**:
- **원칙**: 명확하고 실행 가능한 지시사항
- **길이**: 20-50 단어
- **형식**: 동사 시작, 구체적 액션

**✅ Good Description Examples**:
\`\`\`
"Search the FAQ database using the customer's question as a query.
Return the top 3 most relevant FAQ entries with their answers."

"Analyze the customer's sentiment based on their message text.
Calculate a sentiment score from -1 (negative) to +1 (positive) and
classify as angry, neutral, or satisfied."

"Generate a professional response to the customer based on the
FAQ answer found. Ensure the tone is friendly and empathetic,
and include a follow-up question if needed."
\`\`\`

**❌ Bad Description Examples**:
\`\`\`
"Do customer service"  // ❌ 너무 광범위
"Help the user"  // ❌ 액션 불명확
"Process data"  // ❌ 구체적이지 않음
\`\`\`

---

**Expected Output (기대 출력)**:
- **원칙**: 명확한 출력 형식 및 내용 정의
- **길이**: 10-30 단어
- **형식**: 데이터 구조, 포맷 명시

**✅ Good Expected Output Examples**:
\`\`\`
"A list of 3 FAQ entries in JSON format: [{question, answer, relevance_score}]"

"A sentiment analysis result: {score: float, classification: str, confidence: float}"

"A professional customer response (200-300 words) with empathetic tone and clear answer"
\`\`\`

**❌ Bad Expected Output Examples**:
\`\`\`
"Good result"  // ❌ 형식 불명확
"Customer satisfaction"  // ❌ 측정 불가능
"Output"  // ❌ 내용 불명확
\`\`\`

---

#### Practice #2: Task 의존성 관리 (context_task_ids)

**원칙 1: 명확한 의존성 정의**

**의존성 타입**:
\`\`\`
Type 1: 데이터 의존성
  Task B가 Task A의 출력을 입력으로 사용

Type 2: 순서 의존성
  Task B는 Task A 완료 후 실행

Type 3: 조건 의존성
  Task A 결과에 따라 Task B 실행 여부 결정
\`\`\`

**예시**:
\`\`\`python
# Task 1: FAQ 검색
task1 = TaskSpecModel(
    id="task1_search_faq",
    description="Search FAQ database",
    expected_output="Top 3 FAQ entries",
    agent_id="conversation_agent",
    context_task_ids=[]  # 의존성 없음
)

# Task 2: 감정 분석
task2 = TaskSpecModel(
    id="task2_sentiment",
    description="Analyze customer sentiment",
    expected_output="Sentiment score and classification",
    agent_id="sentiment_agent",
    context_task_ids=[]  # 의존성 없음 (병렬 실행 가능)
)

# Task 3: 응답 생성
task3 = TaskSpecModel(
    id="task3_respond",
    description="Generate customer response",
    expected_output="Professional response (200-300 words)",
    agent_id="conversation_agent",
    context_task_ids=["task1_search_faq", "task2_sentiment"]  # Task 1, 2 결과 필요
)

# 실행 순서:
# Task 1 ∥ Task 2 (병렬)
#        ↓
#     Task 3
\`\`\`

---

**원칙 2: 순환 참조 회피**

**❌ Bad (순환 참조)**:
\`\`\`python
task1 = TaskSpecModel(
    id="task1",
    context_task_ids=["task2"]  # task1 → task2
)

task2 = TaskSpecModel(
    id="task2",
    context_task_ids=["task1"]  # task2 → task1 (순환!)
)
# DependencyValidator가 자동 탐지 및 차단
\`\`\`

**✅ Good (순환 없음)**:
\`\`\`python
task1 = TaskSpecModel(
    id="task1",
    context_task_ids=[]  # 시작 Task
)

task2 = TaskSpecModel(
    id="task2",
    context_task_ids=["task1"]  # task1 → task2
)

task3 = TaskSpecModel(
    id="task3",
    context_task_ids=["task2"]  # task2 → task3
)
# DAG (Directed Acyclic Graph) ✅
\`\`\`

---

#### Practice #3: Async Execution 활용

**async_execution 설정**:
\`\`\`python
# 순차 실행 (기본)
task1 = TaskSpecModel(
    id="task1",
    async_execution=False  # 순차 실행
)

# 비동기 실행
task2 = TaskSpecModel(
    id="task2",
    async_execution=True  # 비동기 실행 (백그라운드)
)
\`\`\`

**언제 async_execution=True를 사용하는가?**

| 상황 | async_execution | 이유 |
|------|----------------|------|
| **I/O Bound Task** | True | 네트워크/DB 대기 시간 활용 |
| **Long Running Task** | True | 백그라운드 실행, 다른 Task 차단 방지 |
| **Independent Task** | True | 다른 Task와 독립적, 병렬 실행 가능 |
| **Critical Path Task** | False | 결과가 즉시 필요, 순차 실행 |

**예시**:
\`\`\`python
# FAQ 검색 (Critical, 순차)
task1 = TaskSpecModel(
    id="task1_search_faq",
    async_execution=False  # 결과 즉시 필요
)

# 로그 저장 (Non-critical, 비동기)
task2 = TaskSpecModel(
    id="task2_log",
    description="Save conversation log to database",
    async_execution=True  # 백그라운드 실행 ✅
)

# 이메일 발송 (Non-critical, 비동기)
task3 = TaskSpecModel(
    id="task3_email",
    description="Send follow-up email to customer",
    async_execution=True  # 백그라운드 실행 ✅
)
\`\`\`

## 4.1 Quality Gate & 6 Validators

### 4.1.1 Quality Gate System 개요

**Quality Gate란?**

Quality Gate는 CAAS의 품질 보증 시스템으로, **각 Phase의 출력물이 다음 Phase로 진행하기 전에 품질 기준을 충족하는지 검증**하는 게이트키퍼 역할을 합니다.

**v0.4.1의 핵심 개선**:
\`\`\`python
# caas_framework/agents/collaboration.py (v0.4.1)

# ❌ Before (v0.2.0-v0.3.0): 기본적으로 우회

# ✅ After (v0.4.1): 기본적으로 엄격
strict_quality_gates: bool = True  # 품질 기준 미달 시 즉시 중단 🚨
\`\`\`

**왜 중요한가?**

1. **품질 보증**: 저품질 출력물이 다음 Phase로 전파되는 것을 차단
2. **조기 오류 발견**: 나중 Phase에서 문제를 발견하면 수정 비용이 10배 이상 증가
3. **일관성 확보**: 모든 프로젝트가 동일한 품질 기준을 준수
4. **추적성**: 어느 Phase에서 품질 문제가 발생했는지 명확히 기록

### 4.1.2 QualityGateSystem 동작 원리

**핵심 컴포넌트**:

\`\`\`python
# caas_framework/quality/quality_gates.py

class QualityGateSystem:
    """
    Quality Gate Evaluation System (v0.4.1)

    Key Features:
    - ✅ AutoMetricsCollector 자동 통합 (v0.4.1)
    - ✅ 메트릭 누락 시 기본값 사용 (None → 0.0)
    - ✅ LLM Judge 타임아웃 (60초)
    - ✅ 무한 대기 버그 100% 해결
    """

    async def evaluate_gate(
        self,
        phase: AgentPhase,
        output: Any,
        context: Dict[str, Any]
    ) -> QualityGateResult:
        """
        Evaluate quality gate for a phase

        Args:
            phase: Current phase
            output: Phase output to evaluate
            context: Execution context (포함: code_artifacts, metrics)

        Returns:
            QualityGateResult with pass/fail status
        """
        # 1. Phase에 맞는 criteria 로드
        criteria = self._get_phase_criteria(phase)

        # 2. ✅ v0.4.1: AutoMetricsCollector로 자동 메트릭 수집
        if "code_artifacts" in context and not context.get("metrics"):
            from caas_framework.quality.metrics_collector import AutoMetricsCollector
            metrics = AutoMetricsCollector.extract_from_code(
                context["code_artifacts"]
            )
            context["metrics"] = metrics  # 자동 주입

        # 3. 각 criterion 평가
        results = []
        for criterion in criteria:
            result = await self._evaluate_criterion(
                criterion, output, context
            )
            results.append(result)

        # 4. 전체 점수 계산
        overall_score = self._calculate_overall_score(results)

        # 5. Pass/Fail 판정
        threshold = self.phase_thresholds.get(phase, 7.0)
        passed = overall_score >= threshold

        return QualityGateResult(
            phase=phase,
            passed=passed,
            overall_score=overall_score,
            criterion_results=results
        )
\`\`\`

**v0.4.1의 3가지 핵심 개선** (무한 대기 버그 해결):

**① AutoMetricsCollector 자동 통합**
\`\`\`python
# Before (v0.2.0-v0.4.0): 수동으로 메트릭 추가 필요
context = {
    "code_artifacts": {...},
    # ❌ metrics 누락 시 Quality Gate가 무한 대기
}

# After (v0.4.1): 자동으로 메트릭 수집
context = {
    "code_artifacts": {...},
    # ✅ AutoMetricsCollector가 자동으로 메트릭 추출 및 주입
}
\`\`\`

**② 메트릭 기본값 사용**
\`\`\`python
# caas_framework/quality/quality_gates.py (v0.4.1)

def _get_metric_value(self, context: Dict, metric_name: str) -> float:
    """
    Get metric value from context, with safe fallback (v0.4.1)
    """
    metrics = context.get("metrics", {})
    value = metrics.get(metric_name)

    # ✅ v0.4.1: None → 0.0 변환 (무한 대기 방지)
    if value is None:
        self.logger.warning(
            f"⚠️ Metric '{metric_name}' not found, using default 0.0"
        )
        return 0.0

    return float(value)
\`\`\`

**③ LLM Judge 타임아웃**
\`\`\`python
# caas_framework/validation/llm_judge.py (v0.4.1)

async def evaluate_quality(...):
    """
    Evaluate quality using LLM with timeout (v0.4.1)
    """
    try:
        # ✅ 60초 타임아웃 추가 (방어적 보호)
        result = await asyncio.wait_for(
            self._llm_evaluate(...),
            timeout=60.0
        )
        return result
    except asyncio.TimeoutError:
        self.logger.error("⏱️ LLM Judge timeout (60s)")
        # Fallback: 기본 점수 반환
        return self._create_default_result()
\`\`\`

**효과**:
- ✅ 무한 대기 발생률: **10-20% → 0%**
- ✅ Quality Gate 100% 신뢰성 확보
- ✅ strict_quality_gates=True 안전하게 사용 가능

### 4.1.3 6 Validators 상세

CAAS는 **6개의 전문 Validator**를 제공하며, 각각 특정 품질 측면을 검증합니다.

#### Validator 1: OntologyValidator

**목적**: 온톨로지 기반 도구 할당 검증

**검증 항목**:
1. **Agent Tool 매칭**: Agent의 Role이 할당된 Tool과 의미적으로 일치하는가?
2. **Tool 존재성**: 모든 Tool이 CAAS Ontology에 정의되어 있는가?
3. **Tool 중복**: 동일한 기능의 Tool이 여러 이름으로 중복 할당되지 않았는가?

**사용 예시**:
\`\`\`python
from caas_framework.validation.ontology_validator import OntologyValidator

validator = OntologyValidator(ontology_path="data/ontology/crewai_ontology.ttl")

# Agent 설계 검증
agents = [
    {
        "role": "Email Manager",
        "tools": ["send_email", "read_email", "search_database"]  # ❌ search_database는 부적합
    }
]

result = validator.validate_agents(agents)
# {
#     "passed": False,
#     "issues": [
#         {
#             "agent": "Email Manager",
#             "tool": "search_database",
#             "reason": "Tool 'search_database' is not semantically aligned with role 'Email Manager'"
#         }
#     ]
# }
\`\`\`

**Best Practice**:
- Agent의 Role과 Goal을 명확히 작성할수록 Tool 매칭 정확도가 향상됨
- CAAS Ontology에 없는 커스텀 Tool은 \`custom_\` 프리픽스 사용 권장

---

#### Validator 2: GoldenDataValidator

**목적**: Golden Data 완전성 및 일관성 검증

**검증 항목**:
1. **필수 필드**: project_name, domain, features, agents_needed, execution_pattern이 모두 존재하는가?
2. **Feature 명세**: 각 Feature가 description, input, output, success_criteria를 포함하는가?
3. **Boundaries 정의**: 시스템 경계가 명확히 정의되어 있는가? (in_scope, out_of_scope)
4. **도메인 일관성**: 선택된 Domain이 Features와 일치하는가?

**사용 예시**:
\`\`\`python
from caas_framework.validation.golden_data_validator import GoldenDataValidator

validator = GoldenDataValidator()

golden_data = {
    "project_name": "Customer Support Bot",
    "domain": "CONVERSATIONAL_AI",
    "features": [
        {
            "id": "F1",
            "name": "Respond to FAQ",
            # ❌ description 누락
            "input": "User question",
            "output": "Answer from FAQ"
            # ❌ success_criteria 누락
        }
    ]
}

result = validator.validate(golden_data)
# {
#     "passed": False,
#     "issues": [
#         "Feature F1: Missing 'description'",
#         "Feature F1: Missing 'success_criteria'"
#     ]
# }
\`\`\`

**Completeness Score 계산**:
\`\`\`python
def calculate_completeness(golden_data: Dict) -> float:
    """
    Calculate Golden Data completeness score (0-10)

    Weights:
    - Required fields: 30%
    - Feature specifications: 40%
    - Boundaries: 20%
    - Consistency: 10%
    """
    score = 0.0

    # Required fields (30%)
    required = ["project_name", "domain", "features", "agents_needed"]
    score += 3.0 * (sum(f in golden_data for f in required) / len(required))

    # Feature specs (40%)
    features = golden_data.get("features", [])
    if features:
        feature_completeness = sum(
            1 for f in features
            if all(k in f for k in ["description", "input", "output", "success_criteria"])
        ) / len(features)
        score += 4.0 * feature_completeness

    # Boundaries (20%)
    boundaries = golden_data.get("boundaries", {})
    if boundaries.get("in_scope") and boundaries.get("out_of_scope"):
        score += 2.0

    # Consistency (10%)
    if validate_domain_consistency(golden_data):
        score += 1.0

    return score
\`\`\`

---

#### Validator 3: DependencyValidator

**목적**: Task 의존성 그래프 검증

**검증 항목**:
1. **순환 참조**: Task 의존성에 순환(cycle)이 없는가?
2. **존재하지 않는 Task**: context_task_ids에 존재하지 않는 Task ID가 없는가?
3. **고립 Task**: 의존성이 전혀 없는 Task가 있는가? (경고)
4. **병목 Task**: 너무 많은 Task가 의존하는 병목 Task가 있는가? (경고)

**사용 예시**:
\`\`\`python
from caas_framework.validation.dependency_validator import DependencyValidator

validator = DependencyValidator()

tasks = [
    {"id": "task1", "context_task_ids": ["task2"]},  # ❌ Cycle: task1 → task2 → task1
    {"id": "task2", "context_task_ids": ["task3"]},
    {"id": "task3", "context_task_ids": ["task1"]}
]

result = validator.validate(tasks)
# {
#     "passed": False,
#     "issues": [
#         {
#             "type": "cycle",
#             "path": ["task1", "task2", "task3", "task1"]
#         }
#     ]
# }
\`\`\`

**순환 탐지 알고리즘** (DFS):
\`\`\`python
def detect_cycles(tasks: List[Dict]) -> List[List[str]]:
    """
    Detect cycles in task dependency graph using DFS

    Returns:
        List of cycles (each cycle is a list of task IDs)
    """
    graph = {task["id"]: task.get("context_task_ids", []) for task in tasks}
    visited = set()
    rec_stack = set()
    cycles = []

    def dfs(node, path):
        visited.add(node)
        rec_stack.add(node)
        path.append(node)

        for neighbor in graph.get(node, []):
            if neighbor not in visited:
                dfs(neighbor, path.copy())
            elif neighbor in rec_stack:
                # Cycle detected!
                cycle_start = path.index(neighbor)
                cycles.append(path[cycle_start:] + [neighbor])

        rec_stack.remove(node)

    for task_id in graph:
        if task_id not in visited:
            dfs(task_id, [])

    return cycles
\`\`\`

**Best Practice**:
- Task 의존성은 단방향 DAG(Directed Acyclic Graph)를 유지해야 함
- 순환 참조가 필요한 경우 → Agent Delegation 또는 Feedback Loop 패턴 사용

---

#### Validator 4: Python311Validator

**목적**: Python 3.11+ 호환성 검증

**검증 항목**:
1. **Python 버전**: 생성된 코드가 Python 3.11 이상과 호환되는가?
2. **구문 오류**: AST 파싱이 성공하는가?
3. **Import 검증**: 모든 import가 설치 가능한 패키지인가?

**AST 기반 검증**:
\`\`\`python
import ast

def validate_syntax(code: str) -> Tuple[bool, List[str]]:
    """
    Validate Python syntax using AST

    Returns:
        (is_valid, error_messages)
    """
    errors = []
    try:
        tree = ast.parse(code)

        # Check for deprecated syntax
        for node in ast.walk(tree):
            # Example: Check for old-style string formatting
            if isinstance(node, ast.Mod) and isinstance(node.left, ast.Str):
                errors.append(
                    f"Line {node.lineno}: Old-style string formatting (%) is deprecated. "
                    "Use f-strings or .format()"
                )

        return len(errors) == 0, errors
    except SyntaxError as e:
        return False, [f"Syntax error at line {e.lineno}: {e.msg}"]

def check_crewai_version_compatibility(
    agents: List[Dict],
    tasks: List[Dict],
    crewai_version: str = "0.28.0"
) -> List[str]:
    """
    Check compatibility with specific CrewAI version

    Returns:
        List of compatibility issues
    """
    issues = []

    # CrewAI 0.28.0+: expected_output is required
    if version.parse(crewai_version) >= version.parse("0.28.0"):
        for task in tasks:
            if "expected_output" not in task:
                issues.append(
                    f"Task '{task.get('id')}': 'expected_output' is required in CrewAI {crewai_version}+"
                )

    # CrewAI 0.30.0+: async_execution requires callback
    if version.parse(crewai_version) >= version.parse("0.30.0"):
        for task in tasks:
            if task.get("async_execution") and not task.get("callback"):
                issues.append(
                    f"Task '{task.get('id')}': 'async_execution' requires 'callback' in CrewAI {crewai_version}+"
                )

    return issues

class ValidationOrchestrator:
    """
    Orchestrate all validators in sequence

    Order:
    1. GoldenDataValidator (가장 기본적)
    2. OntologyValidator (Agent/Tool 매칭)
    3. DependencyValidator (Task 의존성)
    4. CrewAIValidator (CrewAI 호환성)
    5. Python311Validator (생성된 코드)
    """

    async def validate_all(self, **kwargs) -> ValidationResult:
        results = {}

        # 1. Golden Data
        results["GoldenDataValidator"] = await self.golden_validator.validate(
            kwargs["golden_data"]
        )

        # 2. Ontology (if Golden Data passed)
        if results["GoldenDataValidator"]["passed"]:
            results["OntologyValidator"] = await self.ontology_validator.validate(
                kwargs["agents"]
            )

        # 3-5. 나머지 Validators (병렬 실행 가능)
        # ...

        # Overall score
        overall_score = sum(r["score"] for r in results.values()) / len(results)
        overall_passed = all(r["passed"] for r in results.values())

        return ValidationResult(
            overall_passed=overall_passed,
            overall_score=overall_score,
            validators=results
        )

## 4.2 3-Level Auto-Fixing 전략

### 4.2.1 Auto-Fixing 개요

**Auto-Fixing이란?**

CAAS의 **3-Level Auto-Fixing System**은 검증 실패 시 **자동으로 문제를 수정**하는 계층적 시스템입니다.

**3가지 Level**:

\`\`\`
Level 1: Template-based
  - 속도: ⚡⚡⚡ (밀리초)
  - 정확도: 70-80%
  - 사용: 간단한 패턴 수정

Level 2: Rule-based
  - 속도: ⚡⚡ (1-3초)
  - 정확도: 80-90%
  - 사용: 패턴 매칭 기반 수정

Level 3: LLM-based
  - 속도: ⚡ (10-30초)
  - 정확도: 95-99%
  - 사용: 복잡한 로직 수정
\`\`\`

**Fallback 전략**:
\`\`\`
Level 1 시도 → 실패 시 Level 2 시도 → 실패 시 Level 3 시도 → 여전히 실패 시 사용자 개입
\`\`\`

---

### 4.2.2 Level 1: Template-based Fixing

**원리**: 미리 정의된 템플릿으로 간단한 패턴을 교체

**적용 사례**:

**① Agent 필수 필드 누락**
\`\`\`python
# Before (검증 실패)
agent = {
    "role": "Researcher",
    "goal": "Find information"
    # ❌ backstory 누락
}

# Template-based fix
template = {
    "backstory": "An experienced {role} skilled in {goal_verb} with attention to detail."
}

# After (자동 수정)
agent = {
    "role": "Researcher",
    "goal": "Find information",
    "backstory": "An experienced Researcher skilled in finding information with attention to detail."  # ✅ 추가
}
\`\`\`

**② Task expected_output 누락**
\`\`\`python
# Before
task = {
    "description": "Research AI trends",
    # ❌ expected_output 누락
}

# Template fix
task = {
    "description": "Research AI trends",
    "expected_output": "A comprehensive report on current AI trends including key findings and statistics."  # ✅ 자동 생성
}
\`\`\`

**구현 예시**:
\`\`\`python
# caas_framework/fixing/auto_fixer.py (Level 1)

class TemplateFixer:
    """
    Template-based fixing for simple patterns
    """

    TEMPLATES = {
        "agent_backstory": "An experienced {role} skilled in {goal_verb} with attention to detail.",
        "task_expected_output": "A {output_type} including {key_elements}.",
        "tool_description": "A tool to {action} for {purpose}."
    }

    def fix_missing_backstory(self, agent: Dict) -> Dict:
        """Fix missing agent backstory"""
        if "backstory" in agent:
            return agent  # Already exists

        # Extract verb from goal
        goal_verb = self._extract_verb(agent["goal"])

        # Apply template
        agent["backstory"] = self.TEMPLATES["agent_backstory"].format(
            role=agent["role"],
            goal_verb=goal_verb
        )

        return agent

    def _extract_verb(self, goal: str) -> str:
        """Extract action verb from goal"""
        # Simple heuristic: first verb in goal
        import spacy
        nlp = spacy.load("en_core_web_sm")
        doc = nlp(goal)
        for token in doc:
            if token.pos_ == "VERB":
                return token.lemma_
        return "perform tasks"  # Fallback
\`\`\`

**효과**:
- ✅ 속도: **밀리초 단위** (거의 즉시)
- ✅ 비용: **무료** (LLM 호출 없음)
- ✅ 성공률: **70-80%** (단순 패턴)

# caas_framework/fixing/auto_fixer.py (Level 2)

class RuleFixer:
    """
    Rule-based fixing using pattern matching and heuristics
    """

    def fix_tool_mismatch(self, agent: Dict, ontology: Dict) -> Dict:
        """
        Fix tool mismatch by replacing with ontology-suggested tools

        Rules:
        1. Extract agent role keywords
        2. Find tools in ontology matching those keywords
        3. Replace mismatched tools
        """
        role_keywords = self._extract_keywords(agent["role"])

        # Find matching tools from ontology
        matched_tools = []
        for tool_name, tool_meta in ontology["tools"].items():
            tool_keywords = set(tool_meta.get("keywords", []))
            if tool_keywords & role_keywords:  # Intersection
                matched_tools.append(tool_name)

        # Replace tools
        agent["tools"] = matched_tools[:5]  # Max 5 tools
        return agent

    def fix_cycle_in_tasks(self, tasks: List[Dict]) -> List[Dict]:
        """
        Fix cycle by breaking weakest dependency

        Strategy:
        1. Detect cycle using DFS
        2. Find weakest edge (least critical dependency)
        3. Remove that edge
        """
        cycles = self._detect_cycles(tasks)
        if not cycles:
            return tasks

        # For each cycle, remove weakest edge
        for cycle in cycles:
            weakest_edge = self._find_weakest_edge(cycle, tasks)
            # Remove dependency
            from_task_id, to_task_id = weakest_edge
            for task in tasks:
                if task["id"] == from_task_id:
                    task["context_task_ids"] = [
                        tid for tid in task.get("context_task_ids", [])
                        if tid != to_task_id
                    ]

        return tasks

# caas_framework/fixing/auto_fixer.py (Level 3)

class LLMFixer:
    """
    LLM-based fixing for complex logic issues
    """

    def __init__(self, llm_plugin: LLMPlugin):
        self.llm = llm_plugin

    async def fix_agent_consistency(self, agent: Dict, issues: List[str]) -> Dict:
        """
        Fix agent consistency issues using LLM

        Args:
            agent: Agent with issues
            issues: List of identified issues

        Returns:
            Corrected agent
        """
        prompt = self._build_agent_fix_prompt(agent, issues)

        response = await self.llm.ainvoke(
            messages=[{"role": "user", "content": prompt}],
            temperature=0.3,  # Low temperature for consistency
            max_tokens=800
        )

        # Parse JSON from response
        corrected_agent = self._parse_json_safe(response)

        # Validate fix
        if self._validate_agent(corrected_agent):
            return corrected_agent
        else:
            raise FixingError("LLM fix failed validation")

    def _build_agent_fix_prompt(self, agent: Dict, issues: List[str]) -> str:
        """Build prompt for LLM fixing"""
        issues_str = "\\n".join(f"- {issue}" for issue in issues)

        return f"""
Fix the following agent design to resolve consistency issues:

Agent:
\`\`\`json
{json.dumps(agent, indent=2)}
\`\`\`

Issues:
{issues_str}

Instructions:
1. Maintain the agent's core Role
2. Rewrite Goal and Backstory for consistency
3. Ensure all fields align semantically
4. Return ONLY the corrected agent JSON (no explanation)

Output format:
{{
  "role": "...",
  "goal": "...",
  "backstory": "...",
  "tools": [...]
}}
"""

# caas_framework/fixing/auto_fixer.py

async def fix(self, issues: List[Issue]) -> FixResult:
    """
    Hierarchical fixing strategy

    Try Level 1 → Level 2 → Level 3 in sequence
    """
    for issue in issues:
        # Try Level 1
        try:
            fixed = self.template_fixer.fix(issue)
            if self._validate_fix(fixed):
                return fixed
        except FixingError:
            pass

        # Try Level 2
        try:
            fixed = self.rule_fixer.fix(issue)
            if self._validate_fix(fixed):
                return fixed
        except FixingError:
            pass

        # Try Level 3 (last resort)
        fixed = await self.llm_fixer.fix(issue)
        return fixed
\`\`\`

**② 비용 최적화**: Level 1, 2는 무료 → 가능한 한 많이 활용

**③ 시간 최적화**: Level 1 (밀리초) > Level 2 (초) > Level 3 (10초+)

**④ 검증 필수**: 각 Level 수정 후 반드시 Validator로 재검증

# caas_framework/agents/code_analysis_agent.py

async def fix_runtime_errors(
    self,
    project_dir: Path,
    error_log: str
) -> RuntimeErrorFix:
    """
    Analyze and fix runtime errors

    Steps:
    1. Parse error log
    2. Categorize errors (8 types)
    3. Generate fixes using LLM
    4. Apply fixes to code
    5. Validate fixes
    """
    # 1. Parse errors
    errors = self._parse_error_log(error_log)

    # 2. Categorize
    categorized = [
        self._categorize_error(error) for error in errors
    ]

    # 3. Generate fixes (LLM)
    fixes = []
    for error in categorized:
        fix = await self._generate_fix(error, project_dir)
        fixes.append(fix)

    # 4. Apply fixes
    for fix in fixes:
        self._apply_fix(fix, project_dir)

    # 5. Validate
    validation_result = self._validate_fixes(project_dir)

    return RuntimeErrorFix(
        errors=errors,
        fixes=fixes,
        validation=validation_result
    )
\`\`\`

### 4.3.3 추적성 검증 (Traceability Analysis)

**목적**: Golden Data의 모든 Feature가 코드에 구현되었는지 검증

**Traceability Matrix**:

| Feature ID | Feature Name | 구현 파일 | 구현 여부 | 완전성 |
|-----------|-------------|---------|----------|-------|
| F1 | Respond to FAQ | agents.py:15, tasks.py:10 | ✅ | 100% |
| F2 | Create ticket | agents.py:30, tasks.py:25, tools.py:50 | ✅ | 100% |
| F3 | Sentiment analysis | agents.py:45, tasks.py:40, tools.py:80 | ✅ | 100% |
| F4 | Email notification | - | ❌ | 0% |

**분석 로직**:

\`\`\`python
# caas_framework/agents/code_analysis_agent.py

def analyze_traceability(
    self,
    golden_data: Dict,
    code_artifacts: Dict[str, str]
) -> TraceabilityResult:
    """
    Analyze traceability: Golden Data Features → Code Implementation

    Returns:
        TraceabilityResult with completeness score
    """
    features = golden_data.get("features", [])
    traceability_matrix = []

    for feature in features:
        # Feature 키워드 추출
        keywords = self._extract_feature_keywords(feature)

        # 코드에서 키워드 검색
        implementations = []
        for filename, code in code_artifacts.items():
            if self._feature_implemented_in_code(keywords, code):
                implementations.append(filename)

        # Traceability 기록
        traceability_matrix.append({
            "feature_id": feature["id"],
            "feature_name": feature["name"],
            "implemented": len(implementations) > 0,
            "implementation_files": implementations,
            "completeness": self._calculate_feature_completeness(
                feature, implementations, code_artifacts
            )
        })

    # Overall completeness
    overall_completeness = sum(
        row["completeness"] for row in traceability_matrix
    ) / len(traceability_matrix) * 100

    return TraceabilityResult(
        matrix=traceability_matrix,
        overall_completeness=overall_completeness
    )
\`\`\`

**Feature 키워드 추출 (NLP)**:

\`\`\`python
def _extract_feature_keywords(self, feature: Dict) -> List[str]:
    """
    Extract keywords from feature specification

    Uses:
    - Feature name tokenization
    - Description NLP (spaCy)
    - Input/Output fields
    """
    keywords = []

    # Feature name
    keywords.extend(feature["name"].lower().split())

    # Description (NLP - extract nouns and verbs)
    import spacy
    nlp = spacy.load("en_core_web_sm")
    doc = nlp(feature.get("description", ""))
    keywords.extend([
        token.lemma_ for token in doc
        if token.pos_ in ["NOUN", "VERB"] and len(token.text) > 3
    ])

    # Input/Output
    keywords.extend(feature.get("input", "").lower().split())
    keywords.extend(feature.get("output", "").lower().split())

    return list(set(keywords))  # Unique
\`\`\`

**완전성 점수 계산**:

\`\`\`python
def _calculate_feature_completeness(
    self,
    feature: Dict,
    implementation_files: List[str],
    code_artifacts: Dict
) -> float:
    """
    Calculate feature implementation completeness (0-1)

    Criteria:
    - Agent defined: 30%
    - Task defined: 30%
    - Tool implemented: 30%
    - Integration in main.py: 10%
    """
    score = 0.0

    # Agent (30%)
    if any("agents.py" in f for f in implementation_files):
        score += 0.3

    # Task (30%)
    if any("tasks.py" in f for f in implementation_files):
        score += 0.3

    # Tool (30%)
    if any("tools.py" in f for f in implementation_files):
        score += 0.3

    # Integration in main.py (10%)
    main_code = code_artifacts.get("main.py", "")
    if any(keyword in main_code.lower() for keyword in self._extract_feature_keywords(feature)):
        score += 0.1

    return score
\`\`\`

**Best Practice**:
- **Target**: 95%+ completeness
- **Threshold**: 80% 미만이면 재생성 권장
- **Missing Features**: 수동으로 추가하거나 Golden Data 재검토

def verify_business_rules(
    self,
    golden_data: Dict,
    code_artifacts: Dict[str, str]
) -> List[BusinessRuleViolation]:
    """
    Verify business rules in code

    Returns:
        List of violations
    """
    rules = golden_data.get("business_rules", [])
    violations = []

    for rule in rules:
        # 규칙에서 키워드 추출
        keywords = self._extract_rule_keywords(rule["rule"])

        # 코드에서 규칙 준수 여부 검증
        for filename, code in code_artifacts.items():
            if not self._rule_enforced_in_code(keywords, code):
                violations.append(
                    BusinessRuleViolation(
                        rule_id=rule["id"],
                        rule=rule["rule"],
                        violated=True,
                        file=filename,
                        suggestion=self._generate_fix_suggestion(rule, code)
                    )
                )

    return violations

## 5.1 배포 워크플로우

### 5.1.1 프로덕션 배포 개요

**CAAS로 생성된 멀티 에이전트 시스템을 프로덕션 환경에 배포**하는 것은 단순히 코드를 실행하는 것 이상의 의미를 갖습니다.

**프로덕션 배포의 4가지 핵심 요소**:

\`\`\`
1. 환경 구성 (Environment Setup)
   └─> Python 3.11+, 의존성, 환경변수, 리소스

2. 배포 전략 (Deployment Strategy)
   └─> 로컬, 클라우드, 컨테이너, 서버리스

3. 테스트 & 검증 (Testing & Validation)
   └─> Unit, Integration, E2E, Performance

4. 모니터링 & 로깅 (Monitoring & Logging)
   └─> 메트릭, 알람, 로그 수집, 대시보드
\`\`\`

**배포 단계별 체크리스트**:

\`\`\`
Phase A: Pre-deployment (배포 전)
  ✅ 전체 테스트 통과 (pytest)
  ✅ 의존성 검증 (requirements.txt)
  ✅ 환경변수 설정 (.env)
  ✅ 보안 검증 (Bandit)
  ✅ 성능 테스트 (프로파일링)

Phase B: Deployment (배포)
  ✅ 환경 구성 (Docker/K8s)
  ✅ 코드 배포 (CI/CD)
  ✅ Health check
  ✅ Smoke test

Phase C: Post-deployment (배포 후)
  ✅ 모니터링 설정
  ✅ 알람 구성
  ✅ 로그 수집 활성화
  ✅ 문서화 업데이트
\`\`\`

### 5.1.2 배포 전략 선택

#### 전략 1: 로컬 실행 (개발/테스트)

**특징**:
- 가장 간단한 배포 방식
- 개발 및 테스트 환경에 적합
- 프로덕션에는 부적합

**배포 방법**:
\`\`\`bash
# 1. 의존성 설치
cd generated_project
pip install -r requirements.txt

# 2. 환경변수 설정
cp .env.example .env
# .env 파일 편집 (API 키 등)

# 3. 실행
python main.py
\`\`\`

- ✅ 빠른 프로토타이핑
- ✅ 디버깅 용이

- ❌ 고가용성 없음
- ❌ 프로덕션 부적합

#### 전략 2: Docker 컨테이너 (권장) ⭐

**특징**:
- 환경 독립성 확보
- 재현 가능한 배포
- 다양한 플랫폼 지원 (AWS ECS, GCP Cloud Run, Azure Container Instances)

**Dockerfile 생성**:
\`\`\`dockerfile
# Dockerfile (CAAS 생성 코드용)

FROM python:3.11-slim

WORKDIR /app

# 의존성 설치
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

# 코드 복사
COPY . .

# 환경변수 (기본값)
ENV OPENAI_API_KEY=""
ENV LOG_LEVEL="INFO"

# Health check
HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \\
  CMD python -c "import sys; sys.exit(0)"

# 실행
CMD ["python", "main.py"]
\`\`\`

**배포 방법**:
\`\`\`bash
# 1. Docker 이미지 빌드
docker build -t my-caas-agent:v1.0 .

# 2. 환경변수 파일 준비
cat > .env.docker <<EOF
OPENAI_API_KEY=sk-...
LOG_LEVEL=INFO
EOF

# 3. 컨테이너 실행
docker run -d \\
  --name my-agent \\
  --env-file .env.docker \\
  -p 8000:8000 \\
  my-caas-agent:v1.0

# 4. 로그 확인
docker logs -f my-agent
\`\`\`

**Docker Compose (다중 서비스)**:
\`\`\`yaml
# docker-compose.yml

version: '3.8'

services:
  agent:
    build: .
    container_name: my-caas-agent

      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis

volumes:

#### 전략 3: Kubernetes (대규모 프로덕션)

**특징**:
- 자동 확장 (Auto-scaling)
- 고가용성 (HA)
- 롤링 업데이트

**Kubernetes Deployment**:
\`\`\`yaml
# k8s/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: caas-agent
  labels:
    app: caas-agent
spec:
  replicas: 3  # 3개 Pod 실행 (고가용성)
  selector:
    matchLabels:
      app: caas-agent
  template:
    metadata:
      labels:
        app: caas-agent
    spec:
      containers:
      - name: agent
        image: my-registry/caas-agent:v1.0
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: caas-agent-service
spec:
  selector:
    app: caas-agent
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
\`\`\`

**배포 방법**:

kubectl create secret generic agent-secrets \\

# 2. Deployment 적용

# 3. 상태 확인

#### 전략 4: 서버리스 (AWS Lambda, Google Cloud Functions)

**특징**:
- 사용한 만큼만 비용 지불

- 인프라 관리 불필요

**제약사항**:
- ⚠️ 실행 시간 제한 (AWS Lambda: 15분)
- ⚠️ 메모리 제한 (최대 10GB)
- ⚠️ Cold start 문제
- ⚠️ 장기 실행 에이전트 부적합

**AWS Lambda + API Gateway 배포**:

\`\`\`python
# lambda_handler.py (CAAS 코드 래핑)

import json
from main import main as run_agent

def lambda_handler(event, context):
    """
    AWS Lambda handler for CAAS agent

    Trigger: API Gateway, EventBridge, SQS
    """
    try:
        # Input from event
        input_data = json.loads(event.get('body', '{}'))

        # Run agent
        result = run_agent(input_data)

        # Return response
        return {
            'statusCode': 200,
            'body': json.dumps({
                'success': True,
                'result': result
            })
        }
    except Exception as e:
        return {
            'statusCode': 500,
            'body': json.dumps({
                'success': False,
                'error': str(e)
            })
        }
\`\`\`

functions:

### 5.1.3 CI/CD 파이프라인 구축

**목표**: 코드 변경 시 자동으로 테스트, 빌드, 배포

**GitHub Actions 예시**:

\`\`\`yaml
# .github/workflows/deploy.yml

name: Deploy CAAS Agent

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t my-registry/caas-agent:\${{ github.sha }} .
          docker tag my-registry/caas-agent:\${{ github.sha }} my-registry/caas-agent:latest

      - name: Push to registry
        run: |
          echo \${{ secrets.DOCKER_PASSWORD }} | docker login -u \${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push my-registry/caas-agent:\${{ github.sha }}
          docker push my-registry/caas-agent:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/caas-agent \\
            agent=my-registry/caas-agent:\${{ github.sha }}
          kubectl rollout status deployment/caas-agent
\`\`\`

**파이프라인 단계**:

\`\`\`
1. Test (10-20초)
   ├─> Pytest (unit tests)
   ├─> Coverage report
   └─> Quality checks

2. Build (1-2분)
   ├─> Docker image build
   ├─> Security scan
   └─> Push to registry

3. Deploy (30-60초)
   ├─> Rolling update (Kubernetes)
   ├─> Health check
   └─> Notification (Slack/Email)
\`\`\`

## 5.2 반복적 개선 사이클

### 5.2.1 피드백 루프 구축

**CAAS의 반복적 개선 사이클**은 생성된 코드를 지속적으로 개선하는 프로세스입니다.

**4단계 사이클**:

\`\`\`
1. 배포 & 실행 (Deploy & Run)
   └─> 프로덕션 환경에서 에이전트 실행

2. 모니터링 & 수집 (Monitor & Collect)
   └─> 로그, 메트릭, 사용자 피드백 수집

3. 분석 & 진단 (Analyze & Diagnose)
   └─> 문제점 식별, 개선 기회 발견

4. 개선 & 재생성 (Improve & Regenerate)
   └─> Golden Data 업데이트, CAAS 재실행
\`\`\`

### 5.2.2 개선 사이클 실전 예시

**시나리오**: 고객 지원 챗봇 시스템 개선

**초기 배포 (v1.0)**:
\`\`\`python
# Golden Data (v1.0)
{
    "project_name": "Customer Support Bot",
    "domain": "CONVERSATIONAL_AI",
    "features": [
        {"id": "F1", "name": "Respond to FAQ"},
        {"id": "F2", "name": "Create support ticket"}
    ],
    "agents_needed": 2,
    "execution_pattern": "AGENT_BASED"
}
\`\`\`

**Step 1: 배포 & 실행** (1주 운영)
\`\`\`bash
# 프로덕션 배포
docker-compose up -d

# 사용자 트래픽: 1,000 requests/day
\`\`\`

**Step 2: 모니터링 & 수집**

**수집된 데이터**:
\`\`\`yaml
Logs:
  - Error: "Agent timeout after 30s" (15% of requests)
  - Warning: "FAQ database not found" (5% of requests)

Metrics:
  - Avg response time: 8.5s (Target: <3s)
  - Success rate: 85% (Target: >95%)
  - Error rate: 15%

User Feedback:
  - "Bot cannot handle urgent issues" (30 complaints)
  - "No escalation to human agent" (20 complaints)
  - "Sentiment not detected" (15 complaints)
\`\`\`

**Step 3: 분석 & 진단**

**진단 결과**:
1. **Performance Issue**: FAQ 검색이 너무 느림 (평균 6초)
   - 원인: 선형 검색 알고리즘, 캐싱 없음
   - 해결: 벡터 검색 + Redis 캐싱 추가

2. **Missing Feature**: 긴급 상황 감지 및 에스컬레이션 부재
   - 원인: Golden Data에 Feature 누락
   - 해결: Sentiment Analysis Agent 추가

3. **Timeout Issue**: Agent 실행 시간이 너무 길음
   - 원인: 불필요한 Tool 중복 호출
   - 해결: Agent 설계 최적화 (Tool 호출 최소화)

**Step 4: 개선 & 재생성**

**Golden Data 업데이트 (v2.0)**:

        {"id": "F4", "name": "Analyze customer sentiment"}  # ✅ 추가

        }
    ],
    "performance_requirements": {  # ✅ 추가
        "max_response_time": "3s",
        "target_success_rate": 0.95
    }
}

# metrics.py (에이전트 코드에 추가)

from prometheus_client import Counter, Histogram, Gauge
import time

# Metrics 정의
request_count = Counter('agent_requests_total', 'Total agent requests')
request_duration = Histogram('agent_request_duration_seconds', 'Agent request duration')
active_tasks = Gauge('agent_active_tasks', 'Currently active tasks')

# 사용 예시
def run_agent(input_data):
    request_count.inc()
    active_tasks.inc()

    start_time = time.time()
    try:
        result = crew.kickoff(inputs=input_data)
        return result
    finally:
        duration = time.time() - start_time
        request_duration.observe(duration)
        active_tasks.dec()

# error_tracker.py

from collections import defaultdict
import logging

class ErrorTracker:
    """Track and categorize errors"""

    def __init__(self):
        self.error_counts = defaultdict(int)

    def record_error(self, error_type: str, error_msg: str):
        """Record an error occurrence"""
        category = self._categorize_error(error_type)
        self.error_counts[category] += 1

        logging.error(f"[{category}] {error_type}: {error_msg}")

    def _categorize_error(self, error_type: str) -> str:
        """Categorize error into buckets"""
        if "Import" in error_type:
            return "import_error"
        elif "Attribute" in error_type:
            return "attribute_error"
        elif "Timeout" in error_type:
            return "timeout_error"
        else:
            return "other_error"

    def get_summary(self) -> dict:
        """Get error summary"""
        total = sum(self.error_counts.values())
        return {
            "total_errors": total,
            "by_category": dict(self.error_counts),
            "error_rate": total / max(request_count._value.get(), 1)
        }

# cost_tracker.py

class LLMCostTracker:
    """Track LLM API costs"""

    # OpenAI pricing (2026년 기준)
    PRICING = {
        "gpt-4": {
            "input": 0.03 / 1000,   # \$0.03 per 1K tokens
            "output": 0.06 / 1000   # \$0.06 per 1K tokens
        },
        "gpt-3.5-turbo": {
            "input": 0.0015 / 1000,
            "output": 0.002 / 1000
        }
    }

    def __init__(self):
        self.total_input_tokens = 0
        self.total_output_tokens = 0
        self.total_cost = 0.0

    def record_usage(self, model: str, input_tokens: int, output_tokens: int):
        """Record LLM usage"""
        self.total_input_tokens += input_tokens
        self.total_output_tokens += output_tokens

        pricing = self.PRICING.get(model, self.PRICING["gpt-4"])
        cost = (input_tokens * pricing["input"]) + (output_tokens * pricing["output"])
        self.total_cost += cost

        return cost

    def get_summary(self) -> dict:
        """Get cost summary"""
        return {
            "total_input_tokens": self.total_input_tokens,
            "total_output_tokens": self.total_output_tokens,
            "total_cost_usd": round(self.total_cost, 4),
            "avg_cost_per_request": round(
                self.total_cost / max(request_count._value.get(), 1), 4
            )
        }

# logging_config.py

import logging
import sys

def setup_logging(level: str = "INFO"):
    """
    Setup structured logging

    Levels:
    - DEBUG: Development (모든 로그)
    - INFO: Staging (주요 이벤트)
    - WARNING: Production (경고 + 에러만)

    logging.basicConfig(
        level=getattr(logging, level.upper()),
        format='%(asctime)s | %(levelname)-8s | %(name)s | %(message)s',
        datefmt='%Y-%m-%d %H:%M:%S',
        handlers=[
            logging.StreamHandler(sys.stdout),
            logging.FileHandler('agent.log')
        ]
    )

# 사용 예시

# Level 1: DEBUG (개발)

    """Structured JSON logging for easy parsing"""

- name: caas-agent-critical
  interval: 30s
  rules:
    # Alert 1: High Error Rate
    - alert: HighErrorRate
      expr: rate(agent_errors_total[5m]) > 0.1  # >10% error rate
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ \$value | humanizePercentage }} (threshold: 10%)"

    # Alert 2: Service Down
    - alert: ServiceDown
      expr: up{job="caas-agent"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "CAAS Agent service is down"
        description: "Service has been down for more than 1 minute"

    # Alert 3: High Response Time
    - alert: HighResponseTime
      expr: histogram_quantile(0.95, agent_request_duration_seconds) > 5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High response time (P95)"
        description: "P95 response time is {{ \$value }}s (threshold: 5s)"

    # Alert 4: High Cost
    - alert: HighDailyCost
      expr: increase(llm_cost_usd_total[24h]) > 100
      labels:
        severity: warning
      annotations:
        summary: "Daily LLM cost exceeded \$100"

# tools.py (자동 생성 + 보안 추가)

from caas_framework.security import encrypt_pii, audit_log

class SymptomAnalysisTool(BaseTool):
    """Analyze patient symptoms with PII protection"""

    def _run(self, symptoms: str, patient_id: str):
        # ✅ Audit log (BR3)
        audit_log.record("symptom_analysis", patient_id=patient_id)

        # ✅ Encrypt PII (BR1)
        encrypted_patient_id = encrypt_pii(patient_id)

        # Symptom extraction using NLP
        extracted_symptoms = self._extract_symptoms(symptoms)

        return {
            "patient_id": encrypted_patient_id,
            "symptoms": extracted_symptoms
        }

class DrugInteractionTool(BaseTool):
    """Check drug interactions (100% detection required)"""

    def _run(self, proposed_drug: str, current_medications: List[str]):
        # Query drug interaction database
        interactions = self._check_interactions(proposed_drug, current_medications)

        # ✅ Mandatory warning if interactions found (BR1)
        if interactions:
            return {
                "safe": False,
