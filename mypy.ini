[mypy]
# Mypy configuration for CAAS framework
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False  # Start lenient, will make strict later
disallow_any_unimported = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_optional = True

# Per-module options
[mypy-caas_framework.execution.*]
disallow_untyped_defs = True

[mypy-caas_framework.agents.collaboration]
disallow_untyped_defs = True

# Third-party libraries without stubs
[mypy-crewai.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-langchain.*]
ignore_missing_imports = True
