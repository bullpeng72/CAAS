name: CAAS Auto Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      requirement:
        description: 'Requirement description'
        required: true
        default: 'Build a task management system'
      deploy_target:
        description: 'Deployment target'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - kubernetes
          - local

jobs:
  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CAAS
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Validate Environment
        run: |
          python scripts/validate_env.py --export-json validation_results.json

      - name: Upload Validation Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: validation_results.json

  auto-deploy:
    name: Full Automation Workflow
    runs-on: ubuntu-latest
    needs: validate-environment
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CAAS
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Full Automation
        run: |
          REQUIREMENT="${{ github.event.inputs.requirement || 'Build a task management system' }}"
          TARGET="${{ github.event.inputs.deploy_target || 'docker' }}"

          # Run automation with verbose output
          caas auto-deploy "$REQUIREMENT" \
            --target $TARGET \
            --output ./generated \
            --verbose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Generated Code
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-code
          path: generated/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: generated/htmlcov/
          retention-days: 7

  deploy-docker:
    name: Deploy to Docker
    runs-on: ubuntu-latest
    needs: auto-deploy
    if: github.event.inputs.deploy_target == 'docker' || github.event.inputs.deploy_target == ''
    steps:
      - uses: actions/checkout@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-code
          path: generated/

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          cd generated
          docker build -t caas-generated:latest .

      - name: Start Services
        run: |
          cd generated
          docker-compose up -d

      - name: Health Check
        run: |
          # Wait for services to be ready
          sleep 10

          # Check if containers are running
          cd generated
          docker-compose ps

      - name: Run Integration Tests
        run: |
          cd generated
          if [ -d "tests/integration" ]; then
            source venv/bin/activate
            pytest tests/integration/ --verbose || echo "Integration tests failed"
          fi

      - name: Stop Services
        if: always()
        run: |
          cd generated
          docker-compose down

  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: auto-deploy
    if: github.event.inputs.deploy_target == 'kubernetes'
    steps:
      - uses: actions/checkout@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-code
          path: generated/

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Kubernetes
        run: |
          cd generated
          if [ -d "k8s" ]; then
            kubectl apply -f k8s/ --dry-run=client
            echo "Kubernetes manifests validated"
            # Actual deployment would require cluster access
            # kubectl apply -f k8s/
          fi

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [validate-environment, auto-deploy]
    if: always()
    steps:
      - name: Notify Success
        if: needs.auto-deploy.result == 'success'
        run: |
          echo "✅ CAAS Auto Deploy completed successfully!"

      - name: Notify Failure
        if: needs.auto-deploy.result == 'failure'
        run: |
          echo "❌ CAAS Auto Deploy failed!"
          exit 1
