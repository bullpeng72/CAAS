# Multi-Project Specification Example
# This demonstrates a full-stack project with CrewAI agents, Streamlit frontend

version: "1.0"

# ============================================================================
# PROJECT INFO (REQUIRED)
# ============================================================================
project:
  name: "Task Manager AI"
  description: "An AI-powered task management system with intelligent prioritization and scheduling"
  domain: "productivity"

# ============================================================================
# TEMPLATE (REQUIRED for MultiProjectSpec)
# ============================================================================
template: "agent_with_streamlit"  # Options: agent_only, agent_with_api, agent_with_streamlit, full_stack, chatbot

# ============================================================================
# AGENT SPECIFICATION
# ============================================================================
agent_spec:
  agents:
    - id: task_analyzer
      role: "Senior Task Analysis Expert"
      goal: "Analyze tasks and determine priority, effort, and dependencies"
      backstory: |
        You are an experienced project manager with 15 years of experience in
        task analysis and prioritization. You excel at breaking down complex
        projects into manageable tasks and identifying dependencies.
      tools:
        - calculator
      llm:
        model: "gpt-4-turbo-preview"
        temperature: 0.3
      verbose: true
      memory: true
      allow_delegation: false
      max_iter: 15

    - id: scheduler
      role: "Intelligent Task Scheduler"
      goal: "Create optimal task schedules based on priorities and dependencies"
      backstory: |
        You are a scheduling optimization specialist with expertise in
        resource allocation and timeline management. You create realistic
        schedules that maximize productivity.
      tools:
        - calculator
      llm:
        model: "gpt-4-turbo-preview"
        temperature: 0.5
      verbose: true
      memory: true
      allow_delegation: false
      max_iter: 20

  tasks:
    - id: analyze_tasks
      description: |
        Analyze the provided list of tasks and determine:
        1. Priority (high/medium/low)
        2. Estimated effort (hours)
        3. Dependencies on other tasks
        4. Risk factors

        Consider factors like deadlines, business impact, and complexity.
      expected_output: |
        A structured analysis in JSON format containing:
        - Task ID
        - Priority score (1-10)
        - Estimated hours
        - List of dependencies
        - Risk assessment
      agent: task_analyzer
      async_execution: false

    - id: create_schedule
      description: |
        Based on the task analysis, create an optimal schedule that:
        1. Respects task dependencies
        2. Prioritizes high-value tasks
        3. Balances workload over time
        4. Identifies potential bottlenecks

        Create a realistic timeline with milestones.
      expected_output: |
        A detailed schedule in JSON format containing:
        - Daily task assignments
        - Milestone dates
        - Resource allocation
        - Buffer time for risks
      agent: scheduler
      context:
        - analyze_tasks
      async_execution: false

  crew:
    process: "sequential"
    verbose: true
    memory: true
    max_rpm: 30
    share_crew: false

# ============================================================================
# FRONTEND SPECIFICATION (Streamlit)
# ============================================================================
frontend_spec:
  framework: "streamlit"

  pages:
    - name: "main"
      title: "Task Manager AI"
      description: "Intelligent task management with AI-powered scheduling"
      layout: "single_column"
      components:
        - component_id: "task_input"
          component_type: "text_area"
          label: "Enter your tasks (one per line)"
          description: "List all tasks you need to complete"
          props:
            height: 200
            placeholder: "Example:\n- Design database schema\n- Implement user authentication\n- Write API documentation"

        - component_id: "analyze_button"
          component_type: "button"
          label: "Analyze & Schedule"
          description: "Run AI analysis and generate schedule"
          props:
            type: "primary"

        - component_id: "results_display"
          component_type: "markdown"
          label: "Analysis Results"
          description: "Task analysis and schedule"

  theme:
    primaryColor: "#FF4B4B"
    backgroundColor: "#FFFFFF"
    secondaryBackgroundColor: "#F0F2F6"

  api_client:
    base_url: "http://localhost:8000"
    timeout: "60"

  enable_auth: false
  sidebar_components: []

# ============================================================================
# DEPLOYMENT CONFIGURATION
# ============================================================================
deployment_config:
  use_docker: true
  use_docker_compose: true
  use_kubernetes: false

  docker_base_image: "python:3.11-slim"
  docker_ports:
    - 8501  # Streamlit

  env_vars:
    OPENAI_API_KEY: "your-api-key-here"
