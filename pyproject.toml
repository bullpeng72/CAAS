[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caas"
version = "0.6.4"
description = "CrewAI Agent Auto-generation System - Complete Package (Framework + CLI)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "bullpeng72", email = "sungwoo.kim@gmail.com"}
]
keywords = ["crewai", "multi-agent", "ai", "automation", "cli", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]

# Core dependencies for CLI
dependencies = [
    # AI/ML Frameworks (Core)
    "crewai>=0.65.0,<1.0.0",
    "crewai-tools>=0.12.0,<1.0.0",
    "langchain>=0.2.0,<0.4.0",
    "langchain-openai>=0.1.0,<0.3.0",
    "langchain-anthropic>=0.1.0,<0.3.0",
    "langchain-community>=0.2.0,<0.4.0",
    "langchain-core>=0.2.0,<0.4.0",
    "openai>=1.30.0,<2.0.0",
    "anthropic>=0.25.0,<1.0.0",

    # Knowledge Management
    "neo4j>=5.18.0,<6.0.0",
    "owlready2>=0.46,<1.0.0",
    "rdflib>=7.0.0,<8.0.0",

    # Code Generation & Templates
    "jinja2>=3.1.0,<4.0.0",
    "autoflake>=2.2.0,<3.0.0",

    # Core Dependencies
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",

    # CLI Dependencies
    "click>=8.0.0,<9.0.0",

    # Utilities
    "httpx>=0.27.0,<1.0.0",
    "aiofiles>=23.2.0,<24.0.0",
    "tenacity>=8.2.0,<9.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.optional-dependencies]
# Development tools
dev = [
    # Testing Framework
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",

    # Code Quality & Formatting
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=1.8.0,<2.0.0",
]

[project.scripts]
caas = "caas_cli.cli:main"

[project.urls]
Homepage = "https://github.com/bullpeng72/CAAS"
Documentation = "https://github.com/bullpeng72/CAAS#readme"
Repository = "https://github.com/bullpeng72/CAAS"

[tool.setuptools.packages.find]
where = ["."]
# Include framework, CLI, and SDK
include = [
    "caas_framework",
    "caas_framework.*",
    "caas_cli",
    "caas_cli.*",
    "caas_sdk",
    "caas_sdk.*",
]

[tool.setuptools.package-data]
caas_framework = [
    "templates/**/*",
    "codegen/templates/**/*",
    "config/**/*",
    "*.yaml",
    "*.yml",
    "*.json",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=caas_framework --cov=caas_cli --cov-report=term-missing"
