[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caas-framework"
version = "0.2.0"
description = "CrewAI Agent Auto-generation System Framework - UI-independent multi-agent framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CAAS Team"}
]
keywords = [
    "crewai",
    "multi-agent",
    "code-generation",
    "ai",
    "agents",
    "bmad",
    "ontology",
    "pattern-matching"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # AI/ML Frameworks
    "crewai>=0.65.0",
    "crewai-tools[mcp]>=0.12.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.2.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",

    # Knowledge Management
    "neo4j>=5.18.0",
    "owlready2>=0.46",
    "rdflib>=7.0.0",

    # Code Generation & Templates
    "jinja2>=3.1.0",
    "autoflake>=2.2.0",

    # Core Dependencies
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Utilities
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "tenacity>=8.2.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# Rich logging support
rich = [
    "rich>=13.7.0"
]

# Docker sandbox support
docker = [
    "docker>=7.0.0"
]

# Development dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
]

# All optional dependencies
all = [
    "caas-framework[rich,docker,dev]"
]

[project.urls]
Homepage = "https://github.com/bullpeng72/CrewAI-Agent-Autogeneration-System"
Documentation = "https://github.com/bullpeng72/CrewAI-Agent-Autogeneration-System#readme"
Repository = "https://github.com/bullpeng72/CrewAI-Agent-Autogeneration-System"
Issues = "https://github.com/bullpeng72/CrewAI-Agent-Autogeneration-System/issues"

[project.scripts]
caas = "caas_framework.cli:main"

[tool.setuptools]
packages = ["caas_framework"]

[tool.setuptools.package-data]
caas_framework = [
    "codegen/templates/**/*",
    "knowledge/ontologies/**/*",
    "config/*.yaml",
    "config/*.json",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["caas_framework"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
