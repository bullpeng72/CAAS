# Feature Flags Default Configuration

validation:
  enabled: true
  strictness: medium  # low, medium, high
  auto_fix: true
  max_fix_iterations: 5
  confidence_threshold: 0.8
  enable_golden_data_validation: true
  enable_ontology_validation: true
  enable_dependency_validation: true

codegen:
  output_format: production  # basic, production, enterprise
  include_tests: true
  include_docs: true
  include_deployment: true
  include_ci_cd: true
  test_coverage_target: 0.8
  deployment_target: docker

workflow:
  enable_checkpoints: true
  enable_versioning: true
  enable_caching: true
  cache_ttl: 3600  # seconds
  max_parallel_agents: 5

artifacts:
  enabled: true
  generate_project_proposal: true
  generate_requirements_spec: true
  generate_architecture_design: true
  generate_data_design: true
  generate_api_design: false
  generate_agent_design: true
  generate_test_plan: false
  generate_test_report: false
  generate_code_review: false
  generate_deployment_guide: false
  output_format: markdown
  output_dir: ./artifacts
  include_diagrams: true
  include_code_samples: true
  language: ko

mcp:
  enabled: false
  transport_type: http
  server_url: http://localhost:3000
  connect_timeout: 30
