# Feature Flags Default Configuration

validation:
  enabled: true
  strictness: medium  # low, medium, high
  auto_fix: true
  max_fix_iterations: 5
  confidence_threshold: 0.8
  enable_golden_data_validation: true
  enable_ontology_validation: true
  enable_dependency_validation: true

codegen:
  output_format: production  # basic, production, enterprise
  include_tests: true
  include_docs: true
  include_deployment: true
  include_ci_cd: true
  test_coverage_target: 0.8
  deployment_target: docker

workflow:
  enable_checkpoints: true
  enable_versioning: true
  enable_caching: true
  cache_ttl: 3600  # seconds
  max_parallel_agents: 5

artifacts:
  enabled: true

  # ✅ v0.5.0: Dict-based type configuration (10 bool fields → 1 dict)
  # Extensible: add new types without code changes
  types:
    project_proposal: true
    requirements_spec: true
    architecture_design: true
    data_design: true
    api_design: true  # ✅ v0.5.0: Changed to true (generate all artifacts)
    agent_design: true
    test_plan: true  # ✅ v0.5.0: Changed to true (generate all artifacts)
    test_report: true  # ✅ v0.5.0: Changed to true (generate all artifacts)
    code_review: true
    deployment_guide: true  # ✅ v0.5.0: Changed to true (generate all artifacts)

  # Output settings
  output_format: markdown
  output_dir: ./artifacts

  # Additional options
  include_diagrams: true
  include_code_samples: true
  language: ko

mcp:
  enabled: false
  transport_type: http
  server_url: http://localhost:3000
  connect_timeout: 30
