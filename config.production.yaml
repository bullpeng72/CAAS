# Production Environment Configuration
# This file overrides config.yaml for production environment
# Load this by setting: ENVIRONMENT=production

llm:
  # Use best model for production
  model: gpt-4o
  max_tokens: 8192  # Higher capacity for production

graph:
  # Use Neo4j cluster in production
  backend: neo4j
  # Connection details from env vars (NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD)

validation:
  strictness: high  # Strictest validation in prod
  max_fix_iterations: 10  # More attempts to get it right

codegen:
  output_format: enterprise  # Full enterprise features
  include_tests: true
  include_docs: true
  include_deployment: true
  include_ci_cd: true
  test_coverage_target: 0.9  # Higher coverage target

workflow:
  max_parallel_agents: 10  # More parallelism for performance
  cache_ttl: 7200  # 2 hours cache in production

timeouts:
  # Longer timeouts for production workloads
  api_request: 600
  llm_request: 120
  version_control_push: 60

ui:
  expert_mode: false  # Simpler UI for end users
  show_hints: false  # Less hints in production
  progress_verbosity: NORMAL

logging:
  level: INFO  # Less verbose in production
  format: json  # Structured logging for parsing
  output: both  # Log to console and file
  log_dir: /var/log/caas
